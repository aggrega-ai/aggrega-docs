apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-name-collision
  version: "1.0.0"
  description: >
    The same database as the working example, with the alarm attached twice
    instead of once. This build is expected to fail: it is here to show what the
    provider does when two contributors reach one name in the assembled stack.
    Each alarm's resource name carries its attachment name, so the two resources
    stay apart; each alarm's output is named for the host component and the
    entry it publishes, so both outputs reach one name — and renaming the
    component changes that name for both alike, so they still collide.
spec:
  components:
    payments-db:
      type: core/datastore/mariadb
      values:
        database: appdb
        charset: utf8mb4
        collation: utf8mb4_general_ci
      features:
        # Two attachments of one Feature, under two different attachment names.
        # The attachment names differ, so the two are distinct attachments with
        # distinct resources — but the output each one publishes is named for the
        # host component and the entry, which are the same for both.
        storage-headroom:
          type: example/storage-alarm
          values:
            free_storage_bytes: 21474836480
        storage-headroom-strict:
          type: example/storage-alarm
          values:
            free_storage_bytes: 53687091200

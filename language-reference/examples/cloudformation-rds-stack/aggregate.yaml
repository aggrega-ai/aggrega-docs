apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A managed database and the application that reads it, authored once as
    developer intent and targeted at AWS. The Release decides whether both
    components assemble into one CloudFormation stack or two; either way the
    application receives the database endpoint as an intrinsic reference
    CloudFormation resolves at deploy time rather than as a value the build had
    to know.
spec:
  components:
    # ── Database ────────────────────────────────────────────────────────
    # The developer states intent — a database named appdb — and nothing about
    # the physical target. Which engine version, which instance class, and how
    # much storage are operator concerns, set Release-side. So is who owns the
    # root password: each Release binds the Component's root_password slot.
    payments-db:
      type: core/datastore/mariadb
      values:
        database: appdb
        charset: utf8mb4
        collation: utf8mb4_general_ci
      features:
        # An attachment that brings resources. The developer states the
        # headroom the application needs; the alarm watching for it is emitted
        # by the attachment rather than by the database's own Recipe, and lands
        # in the same stack.
        storage-headroom:
          type: example/storage-alarm
          values:
            free_storage_bytes: 21474836480

    # ── Application ─────────────────────────────────────────────────────
    # The application component declares that it uses a database and which of
    # the database's published entries it wants delivered, under the name its own
    # configuration reads. It never names an address: the endpoint does not
    # exist until the stack deploys.
    reporting-app:
      type: example/compute/db-reader
      values:
        parameter_name: /reporting/db-host
      uses:
        database:
          primary:
            target: payments-db
            inject:
              env:
                - in: DB_HOST
                  from: host

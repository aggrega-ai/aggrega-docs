apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: cloudformation-name-collision
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate-name-collision
  manifest: manifest
  boundaries:
    app:
      directory: name-collision
      components:
        payments-db:
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: false
              read_replicas: 0
            backup:
              enabled: true
              retention_days: 14

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloudformation-one-stack
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary becomes one stack, so both components assemble into a single
    # template and the application's reference to the database stays inside it.
    app:
      directory: one-stack
      # A boundary-wide attachment. It is attached here rather than in the
      # Aggregate because what it carries is the operator's own arrangement
      # rather than anything the Aggregate declares, and it renders once for
      # the boundary rather than once per component.
      features:
        shared-settings:
          type: core/shared-config
          infra:
            tier: production
      components:
        payments-db:
          # The Component declares root_password as a required slot: a build
          # halts while nothing binds it. On a managed RDS instance the engine
          # generates and rotates the administrator password itself, so the operator
          # delegates the slot to the engine rather than filling it with a
          # credential: nothing is written here and nothing is rendered for it.
          #
          # RDS keeps the instance's automated backups for 7 days unless a
          # core/backup attachment says otherwise; this one keeps each for 14.
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: true
              read_replicas: 0
        reporting-app:
          infra:
            tier: Standard

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same Grafana server, this time with an admin-password credential
    attached to the component's optional `admin_password` slot. When the
    credential is present the Recipe sets the admin password from the injected
    value: it feeds the chart's admin.password on Kubernetes and the
    GF_SECURITY_ADMIN_PASSWORD environment variable on Compose. Credentials live
    in the secrets: pillar (each Feature is labeled feature.aggrega.ai/kind:
    secret), kept apart from application values.
spec:
  components:
    dashboards:
      type: core/observability/grafana
      secrets:
        admin_password:
          type: core/secret-value
          values:
            key: GRAFANA_ADMIN_PASSWORD
            origin: dev-dashboards-pw-change-me

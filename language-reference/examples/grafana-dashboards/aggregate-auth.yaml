apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same Grafana server, this time with an optional admin-password credential
    attached to the component's `admin_password` slot. When the credential is
    present the injected value is delivered on the component's environment pipe
    and surfaces as the GF_SECURITY_ADMIN_PASSWORD environment variable on
    Compose. Credentials are attachments on the features: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    dashboards:
      type: core/observability/grafana
      features:
        admin_password:
          type: core/secret-value
          values:
            key: GRAFANA_ADMIN_PASSWORD
            origin: dev-dashboards-pw-change-me

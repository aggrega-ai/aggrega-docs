apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    The same Grafana server, this time with a referenceable admin-password
    credential attached to the component's optional `admin_password` slot for the
    synthesized helm target. A referenced-secret credential materializes a
    Kubernetes Secret and publishes its locator; the synthesized Recipe references
    it as an env secretKeyRef (GF_SECURITY_ADMIN_PASSWORD), so the plaintext
    password never lands in the rendered Deployment manifest — only in the Secret.
    Credentials are attachments on the features: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    dashboards:
      type: core/observability/grafana
      features:
        admin_password:
          type: core/referenced-secret
          values:
            key: GRAFANA_ADMIN_PASSWORD
            origin: dev-dashboards-pw-change-me

apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the synthesized helm Recipe
    (helm/grafana), which runs the official upstream grafana/grafana image
    directly with no external chart. The recipe reference is provider-scoped
    because a compose Recipe of the same name also exists. The optional
    admin-password credential is realized by the k8s-secret-from-parameter
    FeatureRecipe, which materializes a Kubernetes Secret the Deployment
    references via an env secretKeyRef; when no credential is attached the
    mapping is inert and the server renders with the Recipe's deterministic
    development password.
spec:
  mappings:
    components:
      type:
        core/observability/grafana:1.0.0: helm/grafana:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: helm/k8s-secret-from-parameter:1.0.0

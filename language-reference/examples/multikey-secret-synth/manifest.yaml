apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: multikey-secret-synth-manifest
  version: "1.0.0"
  description: >
    Helm Ops mapping. local/compute/app binds to the synthesized helm Recipe
    (helm/app), which renders a Deployment directly with no external chart.
    The multi-key credential Feature routes to the FeatureRecipe that
    materializes one Kubernetes Secret carrying several data keys
    (core/referenced-secret-set to k8s-secret-set).
spec:
  mappings:
    components:
      type:
        local/compute/app: helm/app:1.0.0
    features:
      type:
        core/referenced-secret-set:1.0.0: helm/k8s-secret-set:1.0.0

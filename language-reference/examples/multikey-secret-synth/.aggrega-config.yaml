workspace:
  catalog_dirs:
    # The example's own catalog carries the app Component and its synth Recipe.
    - ./catalog
    # The sibling hub catalog supplies the multi-key credential Feature, its
    # FeatureRecipe, and the helm Provider.
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer removes the sibling catalog entry above and
# resolves catalog entities from the hub registry.
default_registry: hub.aggrega.ai

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same PostgreSQL database, this time with an optional password
    credential attached to the component's `password` slot. When the credential
    is present the injected value feeds the chart's superuser password
    (auth.postgresPassword) and the application user's password (auth.password),
    so the deployment uses a known password rather than a chart-generated one.
    Credentials live in the secrets: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: appdb
        user: appuser
      secrets:
        password:
          type: core/secret-value
          values:
            key: POSTGRES_PASSWORD
            origin: dev-postgres-pw-change-me

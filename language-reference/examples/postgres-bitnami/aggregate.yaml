apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single PostgreSQL database realized on Kubernetes through the Bitnami
    PostgreSQL Helm chart. No credential is attached here, so the Recipe uses an
    inline development-default password, keeping the rendered output
    deterministic. The same developer intent is reused by aggregate-auth.yaml,
    which attaches an explicit password credential.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: appdb
        user: appuser

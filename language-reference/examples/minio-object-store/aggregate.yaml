apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single MinIO object-storage server, authored once and compiled to two
    targets: a Docker Compose service for local development and a synthesized helm
    Recipe running the official minio/minio image on Kubernetes. No credential is
    attached here, so the root account uses the Recipe's deterministic development
    password on both targets. The same developer intent drives both; only the
    Recipe layer selected by the Manifest differs.
spec:
  components:
    store:
      type: core/storage/minio

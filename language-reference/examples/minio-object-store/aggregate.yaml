apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single MinIO object-storage server with nothing in its root_password slot.
    The slot is required and has no default, so building this Aggregate halts on
    either target, naming the slot, before anything renders. The two Aggregates
    beside it fill the slot, one for each target's way of delivering the
    credential.
spec:
  components:
    store:
      type: core/storage/minio

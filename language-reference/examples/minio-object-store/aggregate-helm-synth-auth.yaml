apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    The same MinIO server, this time with a referenceable root-password
    credential attached to the component's optional `root_password` slot for the
    synthesized helm target. A referenced-secret credential materializes a
    Kubernetes Secret and publishes its locator; the synthesized Recipe references
    it as an env secretKeyRef (MINIO_ROOT_PASSWORD), so the plaintext password
    never lands in the rendered Deployment manifest — only in the Secret.
    Credentials are attachments on the features: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    store:
      type: core/storage/minio
      features:
        root_password:
          type: core/referenced-secret
          values:
            key: MINIO_ROOT_PASSWORD
            origin: dev-store-pw-change-me

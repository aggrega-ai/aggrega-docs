apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: k8s-bitnami-auth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate-auth
  manifest: manifest-bitnami
  boundaries:
    app:
      directory: app
      components:
        store:
          infra:
            compute:
              cpu: 500m
              memory: 512Mi
            storage:
              size: 8Gi

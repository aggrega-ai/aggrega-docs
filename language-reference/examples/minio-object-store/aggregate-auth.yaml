apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same MinIO server, this time with a root-password credential attached to
    the component's required `root_password` slot. The injected value is
    delivered on the component's environment pipe and surfaces as the
    MINIO_ROOT_PASSWORD environment variable on Compose.
    Credentials are attachments on the features: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    store:
      type: core/storage/minio
      features:
        root_password:
          type: core/secret-value
          values:
            key: MINIO_ROOT_PASSWORD
            origin: dev-store-pw-change-me

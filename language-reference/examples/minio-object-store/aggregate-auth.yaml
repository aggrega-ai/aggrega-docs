apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same MinIO server, this time with a root-password credential attached to
    the component's optional `root_password` slot. When the credential is present
    the Recipe sets the root password from the injected value: it feeds the
    chart's auth.rootPassword on Kubernetes and the MINIO_ROOT_PASSWORD
    environment variable on Compose. Credentials live in the secrets: pillar
    (each Feature is labeled feature.aggrega.ai/kind: secret), kept apart from
    application values.
spec:
  components:
    store:
      type: core/storage/minio
      secrets:
        root_password:
          type: core/secret-value
          values:
            key: MINIO_ROOT_PASSWORD
            origin: dev-store-pw-change-me

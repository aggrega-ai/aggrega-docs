apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same MinIO server, this time with an optional root-password credential
    attached to the component's `root_password` slot. When the credential is
    present the injected value is delivered on the component's environment pipe
    and surfaces as the MINIO_ROOT_PASSWORD environment variable on Compose.
    Credentials live in the secrets: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    store:
      type: core/storage/minio
      secrets:
        root_password:
          type: core/secret-value
          values:
            key: MINIO_ROOT_PASSWORD
            origin: dev-store-pw-change-me

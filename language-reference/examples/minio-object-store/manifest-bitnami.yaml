apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-bitnami
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the Bitnami MinIO Helm chart.
    MinIO is sourced from an OCI chart and rendered via the Helm SDK; the optional
    inject-value credential is realized by the env-secret FeatureRecipe, whose
    value feeds the chart's root password. Recipe selection at build time is by
    component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/storage/minio:1.0.0: minio-bitnami:1.0.0
    features:
      type:
        core/secret-value:1.0.0: env-secret:1.0.0

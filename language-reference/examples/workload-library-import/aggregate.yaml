apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: workload-library-import
  version: "1.0.0"
  description: >
    A single web service whose Recipe synthesizes its Kubernetes Workload from a
    shared library entry instead of an inline body. The Recipe imports
    BaseWorkloads#/workloads/StatelessService; the rendered output is identical
    to the equivalent inline Workload, so factoring the body into a library
    changes nothing about what deploys.
spec:
  components:
    web:
      type: example/compute/web-service
      values:
        image: "nginx:1.27"

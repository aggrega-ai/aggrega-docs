workspace:
  catalog_dirs:
    # The example carries a local Recipe + Component that import a shared
    # Workload body from the hub; the sibling hub supplies the WorkloadLibrary
    # (BaseWorkloads) and the helm provider.
    - ./catalog
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer without the sibling catalog above
# resolves catalog entities from the hub registry.
default_registry: hub.aggrega.ai

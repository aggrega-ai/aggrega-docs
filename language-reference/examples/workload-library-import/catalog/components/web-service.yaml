apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/compute/web-service
  version: "1.0.0"
  description: >
    A generic stateless HTTP web service whose Recipe synthesizes its Kubernetes
    Workload from the shared BaseWorkloads library rather than an inline body.
  labels:
    component.aggrega.ai/type: "server"
    component.aggrega.ai/category: compute
spec:
  schema:
    values:
      image:
        type: string
        default: "nginx:1.27"
        description: Container image for the web service.

apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: local/compute/identity-app
  version: 1.0.0
  description: >
    A minimal stateless application component that runs under a cloud identity.
    It declares that need as a required identity slot, which the Release fills
    with an identity Feature; it declares no identity fields of its own. The
    fill emits the ServiceAccount and publishes its name, and the component's
    Recipe binds the pod to that published name.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  featuresSchema:
    # The cloud identity the workload runs under. The Component declares the
    # need; the Release fills the slot for each target with an identity Feature
    # and that Feature's infra, and the Aggregate writes nothing for it. The
    # selector keeps a credential out of the slot.
    identity:
      required: true
      selector: "feature.aggrega.ai/kind!=secret"
      # The Recipe reads the fill's published name itself.
      inject: []
      description: The cloud identity the workload runs under, filled by the Release.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      greeting:
        type: string
        default: hello
        description: Greeting string the container prints on startup.
    infra:
      # Operational Sizing — filled by the Operator in the Release.
      image_tag:
        type: string
        default: "1.0"
        description: Container image tag.
    provides:
      # Public API Contract — keys exported to consumers via uses edges.
      host:
        type: string

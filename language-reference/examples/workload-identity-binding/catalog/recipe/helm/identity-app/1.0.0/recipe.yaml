apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: identity-app
  version: 1.0.0
  description: >
    The stateless app on Kubernetes via the helm provider's Workload synthesis
    (a Deployment + ClusterIP Service, no external chart). The pod runs under
    the ServiceAccount the attached cloud-identity Feature emits: the Recipe
    reads that ServiceAccount's name from the attachment's published provides,
    so the name is stated once — by the producer — and consumed rather than
    restated here.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: local/compute/identity-app:1.0.0
  # provides.host is the name of the Service the workload declares under the
  # `web` service key: the helm provider names it "<rendered_name>-web".
  provides:
    host: "{{ .context.rendered_name }}-web"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    # The identity attachment emits the ServiceAccount and publishes its name as
    # provides.name. Reading it here binds the pod to the emitted ServiceAccount
    # without restating the name, so the two can never disagree.
    serviceAccount: "{{ .features.identity.provides.name }}"
    containers:
      main:
        image: myapp:{{ .infra.image_tag }}
        variables:
          GREETING: {{ .values.greeting }}
          # The same published name, delivered to the process as an env var.
          IDENTITY_SERVICE_ACCOUNT: {{ .features.identity.provides.name }}
        ports:
          web: 8080
    services:
      web:
        type: ClusterIP
        ports:
          web: 8080

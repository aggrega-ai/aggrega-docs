# The team's file. The workspace key marks this directory as the workspace root,
# so a build run here writes dist/ beside this file.
workspace: {}
# The hub registry supplies every catalog entity this workspace does not
# carry itself.
default_registry: hub.aggrega.ai

# The team's own attachment. A relative path under with.sources resolves
# against the directory of this file.
plugins:
  governance:
    - uri: governance/rego:0.8.6
      role: ir-verdict
      with:
        sources:
          - policies/team.rego

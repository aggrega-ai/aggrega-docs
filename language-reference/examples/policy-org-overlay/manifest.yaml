apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: policy-org-overlay-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. Each component type and the
    secret Feature is routed to the standard-library Recipe that implements it
    on this target.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: compose/mariadb:1.0.0
        core/devtool/adminer:1.0.0: compose/adminer:1.0.0
    features:
      type:
        core/secret-value:1.0.0: compose/dotenv-secret:1.0.0

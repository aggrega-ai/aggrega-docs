apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by synthesized manifests. Every
    component type either module contributes is realized by its synth helm
    Recipe — the object store and the document-database backend as workloads with
    a persistent volume, the read tier and the wire-protocol proxy as stateless
    Deployments. The scrape Feature is mapped alongside them: its FeatureRecipe
    emits one ServiceMonitor for each component the Release attaches it to. So is
    the core/referenced-secret credential Feature, which the metrics module
    attaches to the object store's two key slots and to the key pair the store
    gateway's connection to it carries: bound to k8s-secret-from-parameter, it
    reads each of the module's two key parameters as the value itself and emits
    a Secret carrying it, which suits a stack running on the module's
    development defaults. Recipe selection at build time is by component type
    against the loaded catalog, so the mapping is written once per type however
    many modules bring that type in.
spec:
  mappings:
    components:
      type:
        core/storage/s3-object-store:1.0.0: helm/s3-object-store:1.0.0
        core/observability/thanos-store:1.0.0: helm/thanos-store:1.0.0
        core/observability/thanos-query:1.0.0: helm/thanos-query:1.0.0
        core/datastore/documentdb:1.0.0: helm/documentdb:1.0.0
        core/datastore/ferretdb:1.0.0: helm/ferretdb:1.0.0
    features:
      type:
        core/prometheus-exporter:1.0.0: helm/prometheus-exporter:1.0.0
        core/referenced-secret:1.0.0: helm/k8s-secret-from-parameter:1.0.0

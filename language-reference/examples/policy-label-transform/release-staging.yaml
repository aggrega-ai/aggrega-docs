apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: shop-staging
  # The label-transform policy reads this value and writes it, and the support
  # tier it implies, onto every node it covers.
  environment: staging
  version: "1.0.0"
spec:
  aggregate: policy-label-transform
  manifest: policy-label-transform-manifest
  # Every component the Aggregate declares appears here; each takes its schema
  # defaults.
  components:
    db: {}
    cache: {}
    web: {}

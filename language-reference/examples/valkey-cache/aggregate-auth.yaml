apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same Valkey cache, this time with an optional password credential
    attached to the component's `password` slot. When the credential is
    present the injected value is delivered on the component's environment
    pipe and surfaces as the VALKEY_PASSWORD environment variable on Compose.
    Credentials are attachments on the features: pillar
    (each Feature is labeled feature.aggrega.ai/kind: secret), kept apart from
    application values.
spec:
  components:
    cache:
      type: core/datastore/valkey
      features:
        password:
          type: core/secret-value
          values:
            key: VALKEY_PASSWORD
            origin: dev-cache-pw-change-me

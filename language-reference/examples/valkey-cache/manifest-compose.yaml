apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Valkey component type is
    realized by the compose Recipe; the optional inject-value credential is
    realized by the dotenv-secret FeatureRecipe.
spec:
  mappings:
    components:
      type:
        core/datastore/valkey:1.0.0: compose/valkey:1.0.0
    features:
      type:
        core/secret-value:1.0.0: compose/dotenv-secret:1.0.0

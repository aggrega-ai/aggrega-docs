apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mariadb-helm-synth
  environment: development
  version: "1.0.0"
spec:
  aggregate: mariadb-helm-synth
  manifest: mariadb-helm-synth-manifest
  boundaries:
    main:
      directory: helm
      components:
        # infra — the Operator-sizing pillar, fulfilled per environment. The
        # Developer's Aggregate never carries these fields; they flow into the
        # rendered StatefulSet's volumeClaimTemplate and container image tag.
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 5Gi
              type: standard

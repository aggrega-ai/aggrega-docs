apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: local-dev
  environment: development
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    app:
      directory: app
      components:
        # infra — the Operator-sizing pillar, fulfilled per environment.
        # The Developer's Aggregate never carries these fields.
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 2Gi
        web:
          infra:
            port: 8080

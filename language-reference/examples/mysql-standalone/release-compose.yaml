apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: local-compose
  environment: development
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-compose
  boundaries:
    app:
      directory: app
      components:
        db:
          infra:
            engine_version: "8.4"
            # Provider-specific overrides. The pillar is an open bag: the
            # Component declares it as an object that accepts any nested
            # structure, and each Recipe documents which keys it reads. The
            # compose Recipe reads `image` and, when set, runs that exact
            # reference instead of composing one from engine_version — the
            # path an operator takes to run a registry-mirrored or
            # digest-pinned build of the same server version.
            overrides:
              image: "registry.internal.example/library/mysql:8.4"

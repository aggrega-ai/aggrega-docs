apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    A single MySQL database rendered on Kubernetes by the helm provider's
    Workload synthesis (no external chart). This full variant exercises MySQL's
    two-slot credential model: the required root_password is a Black-Box slot
    delivered on the inject pipe, and the optional user_password is a
    transparent slot delivered as a Kubernetes Secret the StatefulSet
    references via an env secretKeyRef.
spec:
  components:
    db:
      type: core/datastore/mysql
      values:
        database: appdb
        user: appuser
        charset: utf8mb4
        collation: utf8mb4_general_ci
      # Two credential slots, each filled by the family its delivery needs.
      features:
        # root_password is BLACK-BOX (featuresSchema inject: []): the Recipe
        # controls delivery. An inject-value credential (core/secret-value)
        # puts the value on the inject pipe under the chosen key, and the
        # Recipe reads .context.inject.env.MYSQL_ROOT_PASSWORD.
        root_password:
          type: core/secret-value
          values:
            key: MYSQL_ROOT_PASSWORD
            origin: dev-root-pw-change-me
        # user_password is TRANSPARENT (featuresSchema inject: [env, file]). A
        # referenceable credential (core/referenced-secret) materializes a
        # Kubernetes Secret and publishes its locator (name/key) as provides;
        # the Recipe references it via containers.attachments, which the synthesizer
        # renders as an env secretKeyRef on the database container.
        user_password:
          type: core/referenced-secret
          values:
            key: MYSQL_PASSWORD
            origin: dev-user-pw-change-me

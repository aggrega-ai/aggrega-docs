apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single MySQL database, authored once and compiled to two targets: a
    Docker Compose service for local development and the Bitnami MySQL Helm
    chart for Kubernetes. The same developer intent drives both; only the
    Recipe layer selected by the Manifest differs per target.
spec:
  components:
    db:
      type: core/datastore/mysql
      values:
        database: appdb
        user: appuser
        charset: utf8mb4
        collation: utf8mb4_general_ci
      # Credentials live in the secrets: pillar (each Feature is labeled
      # feature.aggrega.ai/kind: secret), never features:. The Component's
      # featuresSchema declares two slots: root_password (black-box) and
      # user_password (transparent). Both are delivered as inject-value
      # credentials here so the value lands on .context.inject.env.<VAR>,
      # which the compose Recipe reads directly.
      secrets:
        root_password:
          type: core/secret-value
          values:
            key: MYSQL_ROOT_PASSWORD
            origin: dev-root-pw-change-me
        user_password:
          type: core/secret-value
          values:
            key: MYSQL_PASSWORD
            origin: dev-app-pw-change-me

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-bitnami
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the Bitnami MySQL Helm
    chart. MySQL is sourced from an OCI chart and rendered via the Helm SDK.
    Recipe selection at build time is by component type against the loaded
    catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/mysql:1.0.0: mysql-bitnami:1.0.0
    features:
      type:
        core/secret-value:1.0.0: env-secret:1.0.0

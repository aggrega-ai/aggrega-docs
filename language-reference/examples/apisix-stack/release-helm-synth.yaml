apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: k8s-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  # The Secret holding the gateway's Admin API key. The Manifest binds the
  # credential to an existing Secret, so this names one rather than carrying
  # the key: create it in the target namespace, with the key under the data key
  # admin-key, before applying the rendered manifests.
  parameters:
    admin_key: apisix-admin-key
  boundaries:
    app:
      directory: app
      components:
        # The module's internal components are addressed by their dotted
        # module-scoped IDs. Compute sizing is owned by the operator; storage
        # and everything else is left to the components' schema defaults.
        gateway.store:
          infra:
            compute:
              cpu: 250m
              memory: 256Mi
        gateway.gateway:
          infra:
            compute:
              cpu: 250m
              memory: 256Mi

# Expected to halt. It fulfils report_schedule on Docker Compose and attaches
# core/manual-trigger to report as well, which does not change the outcome:
# Compose has no scheduler, so a task with a schedule has no realization there,
# attached or not.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: tasks-compose-scheduled
  environment: development
  version: "1.0.0"
spec:
  aggregate: task-run-on-demand
  manifest: manifest-compose
  parameters:
    report_schedule: "30 2 * * 1-5"
  components:
    data-fix:
      infra:
        image: registry.example.com/orders-data-fix:2.0.1
    report:
      infra:
        image: registry.example.com/orders-report:1.4.2
      features:
        on_demand:
          type: core/manual-trigger

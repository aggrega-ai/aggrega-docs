apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for Docker Compose. Each task is a service of one Compose file
    that is not restarted when it exits; the one carrying core/manual-trigger
    sits behind a profile, so docker compose up leaves it stopped.
spec:
  mappings:
    components:
      type:
        core/compute/task:1.0.0: compose/task:1.0.0
    features:
      type:
        core/manual-trigger:1.0.0: compose/manual-trigger:1.0.0

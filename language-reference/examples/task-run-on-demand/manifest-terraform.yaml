apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-terraform
  version: "1.0.0"
  description: >
    Ops mapping for AWS through Terraform. Each task is an Amazon ECS task
    definition on Fargate, from a module kept beside its Recipe, so nothing is
    fetched; a scheduled one also gets an EventBridge Scheduler schedule.
spec:
  mappings:
    components:
      type:
        core/compute/task:1.0.0: terraform/task-ecs:1.0.0
    features:
      type:
        core/manual-trigger:1.0.0: terraform/manual-trigger:1.0.0

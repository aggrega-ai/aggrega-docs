# Expected to halt. It leaves report_schedule empty on Terraform, so report has
# neither a schedule nor core/manual-trigger, and nothing on AWS would ever
# start it.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: tasks-terraform-unscheduled
  environment: production
  version: "1.0.0"
spec:
  aggregate: task-run-on-demand
  manifest: manifest-terraform
  components:
    data-fix:
      infra:
        image: registry.example.com/orders-data-fix:2.0.1
        overrides:
          cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
          subnet_ids:
            - subnet-0123456789abcdef0
          vpc_security_groups:
            - sg-0fedcba9876543210
          execution_role_arn: arn:aws:iam::123456789012:role/example-ecs-task-execution
    report:
      infra:
        image: registry.example.com/orders-report:1.4.2
        overrides:
          cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
          subnet_ids:
            - subnet-0123456789abcdef0
          vpc_security_groups:
            - sg-0fedcba9876543210
          execution_role_arn: arn:aws:iam::123456789012:role/example-ecs-task-execution

apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-helm
  version: "1.0.0"
  description: >
    Ops mapping for Kubernetes through Helm. Each task is a CronJob; the one
    carrying core/manual-trigger is held suspended until someone starts a run.
spec:
  mappings:
    components:
      type:
        core/compute/task:1.0.0: helm/task:1.0.0
    features:
      type:
        core/manual-trigger:1.0.0: helm/manual-trigger:1.0.0

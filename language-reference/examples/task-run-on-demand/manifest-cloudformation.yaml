apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-cloudformation
  version: "1.0.0"
  description: >
    Ops mapping for AWS through CloudFormation. Each task is an Amazon ECS task
    definition on Fargate in one stack template; a scheduled one also gets an
    EventBridge Scheduler schedule.
spec:
  mappings:
    components:
      type:
        core/compute/task:1.0.0: cloudformation/task-ecs:1.0.0
    features:
      type:
        core/manual-trigger:1.0.0: cloudformation/manual-trigger:1.0.0

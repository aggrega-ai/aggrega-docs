apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for Docker Compose. The database and the report job are each a
    service of one Compose file; the job's service sits behind a profile, so
    docker compose up leaves it stopped.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: compose/postgres:1.0.0
        core/compute/task:1.0.0: compose/task:1.0.0
    features:
      type:
        core/manual-trigger:1.0.0: compose/manual-trigger:1.0.0

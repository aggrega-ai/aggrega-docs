apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-arm
  version: "1.0.0"
  description: >
    Ops mapping for Azure through Azure Resource Manager. The database is an
    Azure Database for PostgreSQL flexible server and the report worker an Azure
    Container Apps app, both assembled into one template.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: arm/postgres-flexible-server:1.0.0
        core/compute/worker:1.0.0: arm/worker-container-apps:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0

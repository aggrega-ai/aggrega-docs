apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: orders-compose
  environment: development
  version: "1.0.0"
spec:
  aggregate: policy-render-verdict
  manifest: manifest-compose
  components:
    db: {}
    report:
      infra:
        # The image the job runs, pinned to a release tag. The house rule
        # accepts it; release-compose-unpinned.yaml names the image with no tag.
        image: registry.example.com/orders-report:1.4.2

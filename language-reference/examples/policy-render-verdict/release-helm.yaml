apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: orders-helm
  environment: production
  version: "1.0.0"
spec:
  aggregate: policy-render-verdict
  manifest: manifest-helm
  components:
    db: {}
    report:
      infra:
        # The image the job runs, pinned to a release tag. The house rule
        # accepts it; release-helm-unpinned.yaml runs the same image at latest.
        image: registry.example.com/orders-report:1.4.2

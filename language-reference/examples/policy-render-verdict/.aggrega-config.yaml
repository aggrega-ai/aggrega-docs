# The workspace key marks this directory as the workspace root, so a build run
# here writes dist/ beside this file.
workspace: {}
# The hub registry supplies every catalog entity this workspace does not
# carry itself.
default_registry: hub.aggrega.ai

# No governance attachment here. The house rule is attached by the file a build
# names with --config: governance-rego.yaml or governance-cel.yaml, one per
# policy engine. That file is read as the global configuration and this one
# layers on top of it, and a list this file declared would replace the one the
# named file carries — so this file declares no plugins.governance of its own.

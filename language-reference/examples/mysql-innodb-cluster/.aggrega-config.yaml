workspace:
  catalog_dirs:
    # The sibling standard-library catalog supplies both Components, both
    # Recipes and the helm Provider. This example authors no entities of its
    # own, so there is no local catalog directory to list ahead of it.
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer without the sibling catalog above
# resolves catalog entities from the hub registry.
default_registry: hub.aggrega.ai

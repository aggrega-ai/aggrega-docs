# Sourced compose fragment for the web component. Loaded as literal YAML
# (sourced-mode Render — no template evaluation at this stage); the web
# Recipe's valuesMapping overlay supplies the templated fields (the published
# port and the DB_HOST environment variable). The compose deep-merge combines
# the two: the image stays from this fragment, ports + environment come from
# the overlay.
services:
  web:
    image: nginx:alpine

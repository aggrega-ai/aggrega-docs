apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: db-recipe
  version: "1.0.0"
  description: >
    PostgreSQL for the `backend` boundary via Docker Compose. Synthesized-mode
    Workload: the compose provider translates the Workload kind into a service
    entry (image, port, exposed service).
spec:
  provider: compose
  implements: core/postgres
  provides:
    host: "{{ .context.instance_id }}"
    port: 5432
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: postgres:16
        ports:
          p: 5432
    services:
      db:
        type: ClusterIP
        ports:
          p: 5432

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: compose-bridge-app
  version: "1.0.0"
  description: >
    A two-component stack — an Adminer database UI and a PostgreSQL database —
    that the Release splits across two boundaries (two compose network seams).
    Adminer declares a `backend` use of the database and injects the database
    host into ADMINER_DEFAULT_SERVER; the boundary-scope core/compose-bridge
    rewrites that host to the gateway so the connection crosses the seam.
spec:
  components:
    adminer:
      type: app/adminer
      uses:
        backend:
          primary:
            target: db
            inject:
              env:
                - in: ADMINER_DEFAULT_SERVER
                  from: host
    db:
      type: core/postgres

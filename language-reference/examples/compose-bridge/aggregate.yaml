apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: compose-bridge-app
  version: "1.0.0"
  description: >
    A two-component stack — a web front end and a PostgreSQL database — that
    the Release splits across two boundaries (two compose network seams). The
    web declares a `backend` use of the database and injects the database host
    into DB_HOST; the boundary-scope core/compose-bridge rewrites that host to
    the gateway so the connection crosses the seam.
spec:
  components:
    web:
      type: app/web
      uses:
        backend:
          primary:
            target: db
            inject:
              env:
                - in: DB_HOST
                  from: host
    db:
      type: core/postgres

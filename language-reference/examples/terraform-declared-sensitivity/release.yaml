apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: terraform-declared-sensitivity
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  # Parameter fulfilment (per environment). Both values are placeholders for a
  # worked example and are not credentials for any real service; a Release
  # supplies its own, and a Release that keeps them out of version control
  # fulfils them from its own secret store instead of from this file.
  parameters:
    object_store_access_key_id: "AKIAEXAMPLE0001"
    object_store_secret_access_key: "example-placeholder-not-a-real-credential"
  boundaries:
    infra:
      directory: infra
      components:
        store:
          infra:
            endpoint: "https://objects.example.net"

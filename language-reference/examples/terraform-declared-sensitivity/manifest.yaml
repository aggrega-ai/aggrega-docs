apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Terraform target. The object-store component type binds
    the Terraform Recipe that vendors a local module and supplies its input
    variables. Recipe selection at build time is by component type against the
    loaded catalog.
spec:
  mappings:
    components:
      type:
        example/storage/external-object-store:1.0.0: terraform/external-object-store:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Fluent Bit type is realized
    by the compose Recipe, and the downstream sink by the Adminer compose
    Recipe. The Fluent Bit reference is provider-scoped because a helm Recipe of
    the same name also exists. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/fluent-bit:1.0.0: compose/fluent-bit:1.0.0
        core/devtool/adminer:1.0.0: compose/adminer:1.0.0

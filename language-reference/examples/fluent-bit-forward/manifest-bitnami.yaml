apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-bitnami
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the Bitnami Fluent Bit Helm
    chart. Fluent Bit is sourced from an OCI chart and rendered via the Helm
    SDK; the downstream sink is rendered offline by the Adminer helm Recipe.
    Recipe selection at build time is by component type against the loaded
    catalog.
spec:
  mappings:
    components:
      type:
        core/observability/fluent-bit:1.0.0: fluent-bit-bitnami:1.0.0
        core/devtool/adminer:1.0.0: helm/adminer:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A Fluent Bit log forwarder shipping records to a wired downstream sink,
    authored once and compiled to two targets: a Docker Compose stack for local
    development and the Bitnami Fluent Bit Helm chart for Kubernetes. Fluent Bit
    declares a `forward_target` use of the sink; the sink Recipe's provides host
    and port are piped into Fluent Bit and rendered into a `forward` output. The
    same developer intent drives both; only the Recipe layer selected by the
    Manifest differs.
spec:
  components:
    sink:
      type: core/devtool/adminer
    logs:
      type: core/observability/fluent-bit
      uses:
        forward_target:
          sink:
            target: sink
            inject:
              env:
                - in: FLUENT_FORWARD_HOST
                  from: host
                - in: FLUENT_FORWARD_PORT
                  from: port

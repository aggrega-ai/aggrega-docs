apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same Redis cache, this time with an optional password credential
    attached to the component's `password` slot. When the credential is
    present the Recipe enables password authentication: on Compose the server
    is started with --requirepass set to the injected value, so it requires the
    password. Credentials are attachments on the features: pillar
    (each Feature is labeled feature.aggrega.ai/kind: secret), kept apart from
    application values.
spec:
  components:
    cache:
      type: core/datastore/redis
      features:
        password:
          type: core/secret-value
          values:
            key: REDIS_PASSWORD
            origin: dev-cache-pw-change-me

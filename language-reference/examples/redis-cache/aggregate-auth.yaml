apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same Redis cache, this time with an optional password credential
    attached to the component's `password` slot. When the credential is
    present the Recipe enables password authentication: the injected value
    feeds the chart's auth password on Kubernetes and the REDIS_PASSWORD
    environment variable on Compose. Credentials live in the secrets: pillar
    (each Feature is labeled feature.aggrega.ai/kind: secret), kept apart from
    application values.
spec:
  components:
    cache:
      type: core/datastore/redis
      secrets:
        password:
          type: core/secret-value
          values:
            key: REDIS_PASSWORD
            origin: dev-cache-pw-change-me

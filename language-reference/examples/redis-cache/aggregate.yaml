apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single Redis in-memory cache, authored once and compiled to two targets:
    a Docker Compose service for local development and a synthesized helm
    Recipe running the official redis image on Kubernetes. No credential is attached here, so the cache runs
    without authentication on both targets. The same developer intent drives
    both; only the Recipe layer selected by the Manifest differs.
spec:
  components:
    cache:
      type: core/datastore/redis

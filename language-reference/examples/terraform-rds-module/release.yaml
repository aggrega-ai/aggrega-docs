apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: terraform-rds-module
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    infra:
      directory: infra
      components:
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: true
              read_replicas: 0
            backup:
              enabled: true
              retention_days: 14

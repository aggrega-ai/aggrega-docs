apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: terraform-rds-module
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    infra:
      directory: infra
      components:
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: true
              read_replicas: 0
            backup:
              enabled: true
              retention_days: 14
            # The Recipe reads one provider-specific override: subnet_group,
            # the name of the RDS DB subnet group this instance is placed in.
            # The group is operated outside this deployment and its name differs
            # per environment, so the operator states it here rather than the
            # developer stating it in the Aggregate. It has no default, so
            # omitting it halts the build rather than planning against the
            # wrong network.
            overrides:
              subnet_group: production-private-db-subnets

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single MariaDB database targeted at AWS RDS through a vendored Terraform
    module. The developer states intent once; the Recipe layer decides whether
    that intent renders as an inline HCL body or, as here, as a copied module
    whose input variables the compiler supplies.
spec:
  components:
    # ── Database ────────────────────────────────────────────────────────
    db:
      type: core/datastore/mariadb
      values:
        database: appdb
        user: appuser
        charset: utf8mb4
        collation: utf8mb4_general_ci
      # The Component declares root_password as a slot every deployment binds.
      # On a managed RDS instance the engine generates and rotates the master
      # password itself, so the slot is delegated to the engine rather than
      # filled with an authored value: nothing is written here and nothing is
      # rendered for it. The directive that turns engine management on lives in
      # the vendored module the Recipe copies, which is also why this attachment
      # carries no values.
      features:
        root_password:
          type: core/generated-secret

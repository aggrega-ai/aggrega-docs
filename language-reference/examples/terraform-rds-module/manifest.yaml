apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the AWS RDS target rendered from a vendored Terraform
    module. The MariaDB component type binds the Terraform Recipe that sources
    a local module and supplies its input variables. Recipe selection at build
    time is by component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: terraform/mariadb-rds-module:1.0.0
    features:
      type:
        # The credential Feature routes like any other. The reference is
        # provider-qualified because the standard-library catalog ships a
        # generated-secret FeatureRecipe under more than one provider: a bare
        # name resolves only when exactly one provider carries it, so with
        # several providers a bare `generated-secret:1.0.0` does not resolve at
        # all and the build halts loudly rather than silently picking one. This
        # FeatureRecipe renders nothing — RDS owns the master password, and the
        # module the Recipe copies carries the directive that says so.
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        # The backup Feature binds the FeatureRecipe that leaves the backup to
        # the instance's own automated backups, which the Recipe above
        # configures from the attachment.
        core/backup:1.0.0: terraform/backup-native:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the AWS RDS target rendered from a vendored Terraform
    module. The MariaDB component type binds the Terraform Recipe that sources
    a local module and overlays its input variables. Recipe selection at build
    time is by component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: terraform/mariadb-rds-module:1.0.0

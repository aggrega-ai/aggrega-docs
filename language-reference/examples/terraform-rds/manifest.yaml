apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the AWS RDS target. The MariaDB component type binds the
    Terraform Recipe that emits an inline main.tf HCL body verbatim. Recipe
    selection at build time is by component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: terraform/mariadb-rds:1.0.0

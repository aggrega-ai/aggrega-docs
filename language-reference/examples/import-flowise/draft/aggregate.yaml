apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: imported/flow
  version: 0.1.0
  description: Draft Aggregate imported from a source in the flowise format.
spec:
  components:
    # Left for the Release, since the source cannot supply it:
    #   - infra.image, the container image running Flowise
    #   - infra.owner_email, the email address of the platform's owner account, required while values.flow_definition is set
    #   - the owner_password slot, that account's password, required while values.flow_definition is set
    #   - the credential each connection under uses presents to the part it reaches, attached on that connection
    flowise:
      type: core/ai-agent/flowise
      # For the compose target only, uncomment the lines below, which declare owner_password on flowise: the compose Recipe reads every secret the Release alone attaches under the key value, so the owner's password and a connection's credential would both arrive under it and halt the build; the Release still attaches owner_password, naming this type or none.
      # features:
      #   owner_password:
      #     type: core/secret-value
      #     values:
      #       key: OWNER_PASSWORD
      values:
        # chatflow_id is derived from the exported flow, which gives no identifier of its own.
        chatflow_id: '40d9f5c5-5187-54c1-a9f5-a8dac92f88bb'
        flow_definition: |
          {
            "nodes": [
              {
                "width": 300,
                "height": 574,
                "id": "chatOpenAI_0",
                "position": { "x": 380, "y": 120 },
                "type": "customNode",
                "data": {
                  "id": "chatOpenAI_0",
                  "label": "ChatOpenAI",
                  "version": 6,
                  "name": "chatOpenAI",
                  "type": "ChatOpenAI",
                  "baseClasses": ["ChatOpenAI", "BaseChatModel", "BaseLanguageModel", "Runnable"],
                  "category": "Chat Models",
                  "description": "Wrapper around OpenAI large language models that use the Chat endpoint",
                  "inputParams": [
                    {
                      "label": "Connect Credential",
                      "name": "credential",
                      "type": "credential",
                      "credentialNames": ["openAIApi"],
                      "id": "chatOpenAI_0-input-credential-credential"
                    },
                    {
                      "label": "Model Name",
                      "name": "modelName",
                      "type": "asyncOptions",
                      "loadMethod": "listModels",
                      "default": "gpt-4o-mini",
                      "id": "chatOpenAI_0-input-modelName-asyncOptions"
                    },
                    {
                      "label": "Temperature",
                      "name": "temperature",
                      "type": "number",
                      "step": 0.1,
                      "default": 0.9,
                      "optional": true,
                      "id": "chatOpenAI_0-input-temperature-number"
                    },
                    {
                      "label": "BasePath",
                      "name": "basepath",
                      "type": "string",
                      "optional": true,
                      "additionalParams": true,
                      "id": "chatOpenAI_0-input-basepath-string"
                    },
                    {
                      "label": "BaseOptions",
                      "name": "baseOptions",
                      "type": "json",
                      "optional": true,
                      "additionalParams": true,
                      "id": "chatOpenAI_0-input-baseOptions-json"
                    }
                  ],
                  "inputAnchors": [
                    {
                      "label": "Cache",
                      "name": "cache",
                      "type": "BaseCache",
                      "optional": true,
                      "id": "chatOpenAI_0-input-cache-BaseCache"
                    }
                  ],
                  "inputs": {
                    "cache": "",
                    "modelName": "gpt-4o-mini",
                    "temperature": 0.4,
                    "basepath": "",
                    "baseOptions": ""
                  },
                  "outputAnchors": [
                    {
                      "id": "chatOpenAI_0-output-chatOpenAI-ChatOpenAI|BaseChatModel|BaseLanguageModel|Runnable",
                      "name": "chatOpenAI",
                      "label": "ChatOpenAI",
                      "type": "ChatOpenAI | BaseChatModel | BaseLanguageModel | Runnable"
                    }
                  ],
                  "outputs": {},
                  "selected": false
                },
                "selected": false,
                "positionAbsolute": { "x": 380, "y": 120 },
                "dragging": false
              },
              {
                "width": 300,
                "height": 253,
                "id": "bufferMemory_0",
                "position": { "x": 380, "y": 760 },
                "type": "customNode",
                "data": {
                  "id": "bufferMemory_0",
                  "label": "Buffer Memory",
                  "version": 2,
                  "name": "bufferMemory",
                  "type": "BufferMemory",
                  "baseClasses": ["BufferMemory", "BaseChatMemory", "BaseMemory"],
                  "category": "Memory",
                  "description": "Retrieve chat messages stored in database",
                  "inputParams": [
                    {
                      "label": "Session Id",
                      "name": "sessionId",
                      "type": "string",
                      "default": "",
                      "additionalParams": true,
                      "optional": true,
                      "id": "bufferMemory_0-input-sessionId-string"
                    },
                    {
                      "label": "Memory Key",
                      "name": "memoryKey",
                      "type": "string",
                      "default": "chat_history",
                      "additionalParams": true,
                      "id": "bufferMemory_0-input-memoryKey-string"
                    }
                  ],
                  "inputAnchors": [],
                  "inputs": {
                    "sessionId": "",
                    "memoryKey": "chat_history"
                  },
                  "outputAnchors": [
                    {
                      "id": "bufferMemory_0-output-bufferMemory-BufferMemory|BaseChatMemory|BaseMemory",
                      "name": "bufferMemory",
                      "label": "BufferMemory",
                      "type": "BufferMemory | BaseChatMemory | BaseMemory"
                    }
                  ],
                  "outputs": {},
                  "selected": false
                },
                "selected": false,
                "positionAbsolute": { "x": 380, "y": 760 },
                "dragging": false
              },
              {
                "width": 300,
                "height": 383,
                "id": "conversationChain_0",
                "position": { "x": 800, "y": 360 },
                "type": "customNode",
                "data": {
                  "id": "conversationChain_0",
                  "label": "Conversation Chain",
                  "version": 3,
                  "name": "conversationChain",
                  "type": "ConversationChain",
                  "baseClasses": ["ConversationChain", "LLMChain", "BaseChain", "Runnable"],
                  "category": "Chains",
                  "description": "Chat models specific conversational chain with memory",
                  "inputParams": [
                    {
                      "label": "System Message",
                      "name": "systemMessagePrompt",
                      "type": "string",
                      "rows": 4,
                      "additionalParams": true,
                      "optional": true,
                      "id": "conversationChain_0-input-systemMessagePrompt-string"
                    }
                  ],
                  "inputAnchors": [
                    {
                      "label": "Chat Model",
                      "name": "model",
                      "type": "BaseChatModel",
                      "id": "conversationChain_0-input-model-BaseChatModel"
                    },
                    {
                      "label": "Memory",
                      "name": "memory",
                      "type": "BaseMemory",
                      "id": "conversationChain_0-input-memory-BaseMemory"
                    }
                  ],
                  "inputs": {
                    "model": "{{"{{"}}chatOpenAI_0.data.instance}}",
                    "memory": "{{"{{"}}bufferMemory_0.data.instance}}",
                    "systemMessagePrompt": "You answer questions about the support plans of a small software company. Keep each answer short, and say so when you do not know."
                  },
                  "outputAnchors": [
                    {
                      "id": "conversationChain_0-output-conversationChain-ConversationChain|LLMChain|BaseChain|Runnable",
                      "name": "conversationChain",
                      "label": "ConversationChain",
                      "type": "ConversationChain | LLMChain | BaseChain | Runnable"
                    }
                  ],
                  "outputs": {},
                  "selected": false
                },
                "selected": false,
                "positionAbsolute": { "x": 800, "y": 360 },
                "dragging": false
              }
            ],
            "edges": [
              {
                "source": "chatOpenAI_0",
                "sourceHandle": "chatOpenAI_0-output-chatOpenAI-ChatOpenAI|BaseChatModel|BaseLanguageModel|Runnable",
                "target": "conversationChain_0",
                "targetHandle": "conversationChain_0-input-model-BaseChatModel",
                "type": "buttonedge",
                "id": "chatOpenAI_0-chatOpenAI_0-output-chatOpenAI-ChatOpenAI|BaseChatModel|BaseLanguageModel|Runnable-conversationChain_0-conversationChain_0-input-model-BaseChatModel"
              },
              {
                "source": "bufferMemory_0",
                "sourceHandle": "bufferMemory_0-output-bufferMemory-BufferMemory|BaseChatMemory|BaseMemory",
                "target": "conversationChain_0",
                "targetHandle": "conversationChain_0-input-memory-BaseMemory",
                "type": "buttonedge",
                "id": "bufferMemory_0-bufferMemory_0-output-bufferMemory-BufferMemory|BaseChatMemory|BaseMemory-conversationChain_0-conversationChain_0-input-memory-BaseMemory"
              }
            ]
          }
      uses:
        model:
          chatopenai-0:
            target: chatopenai-0
    # resembles core/ai-model/openai (score 0.9000); reference it by setting type: core/ai-model/openai
    chatopenai-0:
      type: imported/ai-model/chatopenai

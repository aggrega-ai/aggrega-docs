workspace:
  catalog_dirs:
    # This workspace authors no catalog entity of its own, so it needs no
    # source beyond the standard-library catalog.
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer without the sibling catalog above
# resolves catalog entities from the hub registry, and the gateway
# configuration step the shield's realization runs is resolved from there.
default_registry: hub.aggrega.ai

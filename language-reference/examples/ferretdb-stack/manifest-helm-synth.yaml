apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by synthesized manifests. The
    document-database backend and proxy types are realized by their synth helm
    Recipes — the backend as a StatefulSet with a persistent volume, the proxy
    as a stateless Deployment. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/documentdb:1.0.0: helm/documentdb:1.0.0
        core/datastore/ferretdb:1.0.0: helm/ferretdb:1.0.0

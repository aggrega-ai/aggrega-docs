apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: k8s-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  boundaries:
    app:
      directory: app
      components:
        # The module's internal components are addressed by their dotted
        # module-scoped IDs. Compute sizing is owned by the operator; storage
        # and everything else is left to the components' schema defaults, so the
        # stack renders self-contained.
        database.backend:
          infra:
            compute:
              cpu: 500m
              memory: 512Mi
        database.proxy:
          infra:
            compute:
              cpu: 250m
              memory: 256Mi

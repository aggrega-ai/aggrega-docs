apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A document database exposing the MongoDB wire protocol, imported as a
    reusable module. The module is a sub-aggregate that composes two
    single-workload components — a stateless proxy that speaks the wire
    protocol and a PostgreSQL/DocumentDB backend that persists the data — and
    wires its own internal edge from the proxy to the backend. The module
    exports the proxy as its public endpoint `mongo`. This top-level Aggregate
    imports the module by name; the operator sizes the module's internal
    components in the Release.
spec:
  aggregates:
    database:
      type: core/ferretdb

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: keycloak-mcp-authorization
  version: "1.0.0"
  description: >
    A Keycloak identity server backed by PostgreSQL, deployed to act as the
    authorization server an `aggrega mcp` listener verifies bearer tokens
    against. The two components and the edge between them are the ones the
    standard-library `core/keycloak` module composes; they are composed here
    directly so that each credential slot can be filled. Every password the
    stack uses is read from one Kubernetes Secret you create before deploying,
    attached by reference: nothing secret is written in this file, in the
    Release, or in the rendered artifacts.
spec:
  parameters:
    credentials_secret:
      type: string
      default: keycloak-credentials
      description: >
        Name of the Kubernetes Secret, created in the target namespace before
        deploying, that holds the database password under `db-password` and
        the bootstrap admin password under `admin-password`.
  components:
    backend:
      type: core/datastore/postgres
      values:
        user: keycloak
        database: keycloak
      features:
        password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.credentials_secret }}"
            key: db-password
    server:
      type: core/security/keycloak
      uses:
        backend:
          db:
            target: backend
            inject:
              env:
                - { in: KC_DB_URL_HOST, from: host }
                - { in: KC_DB_URL_PORT, from: port }
                - { in: KC_DB_USERNAME, from: user }
                - { in: KC_DB_URL_DATABASE, from: database }
      features:
        # The server signs in to the backend with the same password the
        # backend was initialised with, read from the same Secret entry.
        password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.credentials_secret }}"
            key: db-password
        admin_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.credentials_secret }}"
            key: admin-password

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the official Grafana Tempo
    Helm chart. Tempo is sourced from an OCI chart and rendered via the Helm SDK
    in its single-binary shape. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/tempo:1.0.0: tempo:1.0.0

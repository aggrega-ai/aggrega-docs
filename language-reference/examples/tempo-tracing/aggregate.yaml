apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A Grafana Tempo distributed-tracing server for Kubernetes, authored once and
    compiled to native Kubernetes resources in its single-binary shape.
    Tempo receives trace spans over the OpenTelemetry protocol and answers
    trace-lookup and search queries over its HTTP API; an instrumented
    application pushes spans to its OTLP receiver and a dashboards server reads
    them back. The developer keeps stored traces for seven days.
spec:
  components:
    tracing:
      type: core/observability/tempo
      values:
        retention_period: "168h"

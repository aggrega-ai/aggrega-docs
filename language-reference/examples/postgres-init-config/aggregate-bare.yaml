apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres-bare
  version: "1.0.0"
  description: >
    A single PostgreSQL database with no bootstrap scripts and no custom server
    configuration. The developer leaves init_scripts and custom_config unset, so
    the database renders exactly as a minimal deployment does: no ConfigMap, no
    configmap volume, and no config-file argument on the container. This is the baseline
    that proves the two optional values are additive — a deployment that does not
    use them is unchanged.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: appdb
        user: appuser

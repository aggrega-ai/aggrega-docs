apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres-init-config-manifest
  version: "1.0.0"
  description: >
    Helm Ops mapping. core/datastore/postgres binds to the synthesized helm
    Recipe (helm/postgres), which renders a StatefulSet directly with no
    external chart. The same mapping serves both the bare and the configured
    deployments; the difference between them is only the developer values in the
    Aggregate, never the Ops routing.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres: helm/postgres:1.0.0

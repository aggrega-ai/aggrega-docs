apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres-bare
  environment: development
  version: "1.0.0"
spec:
  aggregate: postgres-bare
  manifest: postgres-init-config-manifest
  boundaries:
    main:
      directory: helm
      components:
        db:
          infra:
            engine_version: "16"
            storage:
              size: 5Gi
              type: standard

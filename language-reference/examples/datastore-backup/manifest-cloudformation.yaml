apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-cloudformation
  version: "1.0.0"
  description: >
    AWS through CloudFormation, with the database an Amazon RDS instance backed
    up by RDS's own automated backups.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-rds:1.0.0
    features:
      type:
        # Renders nothing: the database's Recipe reads the attachment and sets
        # the instance's backup properties itself.
        core/backup:1.0.0: cloudformation/backup-native:1.0.0

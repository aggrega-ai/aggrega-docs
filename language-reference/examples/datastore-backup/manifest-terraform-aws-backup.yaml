apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-terraform-aws-backup
  version: "1.0.0"
  description: >
    AWS through Terraform, with the database an Amazon RDS instance backed up
    by AWS Backup. It differs from manifest-terraform in the one line binding
    core/backup.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-rds:1.0.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-aws-backup:1.0.0

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: datastore-backup-terraform
  environment: production
  version: "1.0.0"
spec:
  aggregate: datastore-backup
  manifest: manifest-terraform
  # backup_controller is left at none: no bucket and no controller.
  components:
    db:
      # The same attachment as on Kubernetes, with no store connection: RDS
      # keeps its backups in its own storage.
      features:
        backup:
          type: core/backup
          infra:
            schedule: "30 2 * * *"
            retention_days: 14
      # Placeholders for resources the operator already runs.
      infra:
        overrides:
          subnet_group: example-private-db-subnets
          vpc_security_groups:
            - sg-0123456789abcdef0

apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Docker Compose, with the database run as a service. No FeatureRecipe
    realizes core/backup on Docker Compose, so this Manifest binds none.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: compose/postgres:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: cel
  version: "1.0.0"
  pluginType: governance
  description: >
    The Common Expression Language policy engine, attached over this
    workspace's build graph by governance-cel.yaml. The entity is the identity
    the attachment names; the artifact behind it is the guest the compiler
    serves for that identity. Version 1.0.0 is this workspace's own
    declaration, not a coordinate published anywhere.
spec:
  abiVersion: v1alpha1
  exports:
    - name: verdict_ir
    - name: verdict_render
    - name: mutate
    - name: transform_annotations

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: extends-wrapper-local
  environment: development
  version: "1.0.0"
spec:
  aggregate: extends-wrapper-reviewed
  manifest: extends-wrapper-manifest
  components:
    # infra — the Operator-sizing pillar. These keys are declared in
    # core/gateway/nginx's and core/devtool/adminer's infra pillars; the wrapper
    # declares none of its own, and a Release fulfils the base's contract for a
    # wrapper instance exactly as it does for a base instance.
    edge:
      infra:
        port: 8080
    internal:
      infra:
        port: 8081
    console:
      infra:
        port: 8082

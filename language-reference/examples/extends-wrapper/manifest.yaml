apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: extends-wrapper-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target, shared by both releases. The
    wrapper's line and the base's line name the same Recipe, which is the whole
    point: a Recipe declaring implements: core/gateway/nginx is the concrete
    implementation for every Component extending that base, so the wrapper needs
    no Recipe of its own.
spec:
  mappings:
    components:
      type:
        # The wrapper's own mapping line. Recipe selection is by exact mapping
        # key, so the wrapper needs this entry even though its base has one —
        # it does not inherit the base's line. That is the entire authoring cost
        # of consuming the wrapper: one line, pointing at the base's Recipe.
        example/gateway/nginx-reviewed:1.0.0: compose/nginx:1.0.0
        # The base, mapped to the same Recipe. Only the control release
        # (release-negative-unreviewed.yaml) declares a component of this type.
        core/gateway/nginx:1.0.0: compose/nginx:1.0.0
        core/devtool/adminer:1.0.0: compose/adminer:1.0.0

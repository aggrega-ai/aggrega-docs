apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A PostgreSQL database and the server that reads it. This is the whole of the
    developer-authored surface: which cloud runs them, how large they are and
    where they sit on the network are decided by the Release and the Manifest,
    never here.
spec:
  components:
    # -- Database --------------------------------------------------------
    # The developer states intent: a logical database named orders, owned by
    # the orders_admin user. Nothing here says where the database runs or how
    # large it is.
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    # -- Server ----------------------------------------------------------
    # The server declares that it uses the database and which of the database's
    # published entries it wants, under the environment variable names its own
    # configuration reads. It never names an address: the database's address
    # does not exist until the target creates the instance, so what the server
    # receives is a reference the target resolves when it applies.
    api:
      type: core/compute/server
      uses:
        database:
          db:
            target: db
            inject:
              env:
                - in: DB_HOST
                  from: host
                - in: DB_PORT
                  from: port
                - in: DB_USER
                  from: user
                - in: DB_NAME
                  from: database

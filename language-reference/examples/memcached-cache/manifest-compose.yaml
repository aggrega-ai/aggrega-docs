apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Memcached component type is
    realized by the compose Recipe; the dotenv-secret mapping lets the negative
    Release resolve the password its Aggregate attaches, which the Recipe then
    refuses.
spec:
  mappings:
    components:
      type:
        core/datastore/memcached:1.0.0: compose/memcached:1.0.0
    features:
      type:
        core/secret-value:1.0.0: compose/dotenv-secret:1.0.0

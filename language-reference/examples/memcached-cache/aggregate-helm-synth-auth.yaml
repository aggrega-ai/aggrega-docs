apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    A negative example: the same Memcached cache with a referenceable password
    credential attached to the component's optional `password` slot, for the
    synthesized helm target. The build halts in the Recipe, naming the slot,
    because the memcached image enforces no password and the catalog's
    Memcached clients speak neither of its authentication modes, so a
    Kubernetes Secret holding the password would protect nothing. Credentials
    live on the features: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    cache:
      type: core/datastore/memcached
      features:
        password:
          type: core/referenced-secret
          values:
            key: MEMCACHED_PASSWORD
            origin: dev-cache-pw-change-me

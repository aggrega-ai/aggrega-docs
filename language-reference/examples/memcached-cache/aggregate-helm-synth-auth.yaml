apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    The same Memcached cache, this time with a referenceable password credential
    attached to the component's optional `password` slot for the synthesized
    helm target. A referenced-secret credential materializes a Kubernetes Secret
    and publishes its locator; the synthesized Recipe references it as an env
    secretKeyRef (MEMCACHED_PASSWORD) and emits MEMCACHED_USERNAME from the
    developer value, so the plaintext password never lands in the rendered
    manifest. SASL authentication requires a Memcached image built with SASL
    support; the plain official image ignores these variables. Credentials live
    in the secrets: pillar (each Feature is labeled feature.aggrega.ai/kind:
    secret), kept apart from application values.
spec:
  components:
    cache:
      type: core/datastore/memcached
      values:
        username: cache
      secrets:
        password:
          type: core/referenced-secret
          values:
            key: MEMCACHED_PASSWORD
            origin: dev-cache-pw-change-me

apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single Memcached in-memory cache, authored once and compiled to two
    targets: a Docker Compose service for local development and a synthesized
    Kubernetes workload running the official image. The cache runs without
    authentication on both targets. The same developer intent drives both;
    only the Recipe layer selected by the Manifest differs.
spec:
  components:
    cache:
      type: core/datastore/memcached

apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    An OpenBao secrets-management server for Kubernetes, authored once and
    compiled to the official OpenBao Helm chart. OpenBao stores and controls
    access to tokens, passwords, certificates, and other secrets behind an
    authenticated HTTP API, keeping its encrypted state on a durable data
    volume. The developer keeps the built-in web UI on for interactive
    administration; the server is initialized and unsealed at runtime inside
    the cluster, so no credential is declared here.
spec:
  components:
    secrets:
      type: core/security/openbao
      values:
        ui_enabled: true

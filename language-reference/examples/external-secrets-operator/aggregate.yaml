apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    An external-secrets operator for Kubernetes, authored once and compiled to
    the official external-secrets Helm chart. external-secrets synchronizes
    secret material from external secret-management systems into native
    Kubernetes Secrets, keeping them in sync as the source changes. It extends
    the cluster with its own ExternalSecret and SecretStore custom resources;
    the developer installs those definitions with the release so the
    external-secrets API is available in the cluster.
spec:
  components:
    external-secrets:
      type: core/security/external-secrets
      values:
        install_crds: true

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: k8s
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    app:
      directory: app
      components:
        external-secrets:
          # Operational sizing owned by the operator. Set explicitly so the
          # chart values render without relying on schema defaults.
          infra:
            compute:
              cpu: 100m
              memory: 128Mi

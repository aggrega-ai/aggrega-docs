apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the official external-secrets
    Helm chart. external-secrets is sourced from an OCI chart and rendered via
    the Helm SDK. Recipe selection at build time is by component type against the
    loaded catalog.
spec:
  mappings:
    components:
      type:
        core/security/external-secrets:1.0.0: helm/external-secrets:1.0.0

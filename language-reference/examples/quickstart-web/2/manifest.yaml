apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: quickstart-web-compose
  version: "1.0.0"
  description: >
    Ops mapping for Docker Compose on one machine. Each component type binds
    its Compose Recipe, and the password attachments bind the realization that
    writes their value into the Compose file as written.
spec:
  mappings:
    components:
      type:
        core/compute/server:1.0.0: compose/server:1.0.0
        core/datastore/postgres:1.0.0: compose/postgres:1.0.0
        core/datastore/redis:1.0.0: compose/redis:1.0.0
    features:
      type:
        core/secret-value:1.0.0: compose/dotenv-secret:1.0.0

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: local-compose
  environment: development
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-compose
  boundaries:
    app:
      directory: app
      components:
        # The SeaweedFS realization fixes its image, port and volume and reads
        # no region, so the operator sets nothing here.
        store: {}

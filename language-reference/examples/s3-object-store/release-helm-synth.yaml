apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: k8s-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  boundaries:
    app:
      directory: app
      components:
        # The SeaweedFS realization fixes its image, port and volume size and
        # reads no region, so the operator sets nothing here.
        store: {}

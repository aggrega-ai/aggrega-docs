apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the synthesized helm Recipe
    helm/s3-object-store, which runs SeaweedFS from its project's published
    image with no external chart. The recipe reference is provider-scoped
    because a compose Recipe of the same name also exists. The two keys are
    realized by the k8s-secret-from-parameter FeatureRecipe, which emits one
    Kubernetes Secret per key for the StatefulSet to reference through an env
    secretKeyRef; an Aggregate attaching no key halts the build in the Recipe,
    naming the empty slot.
spec:
  mappings:
    components:
      type:
        core/storage/s3-object-store:1.0.0: helm/s3-object-store:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: helm/k8s-secret-from-parameter:1.0.0

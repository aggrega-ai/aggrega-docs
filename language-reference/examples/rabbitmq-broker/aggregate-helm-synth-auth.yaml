apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    The same RabbitMQ broker, this time with a referenceable password
    credential attached to the component's optional `password` slot for the
    synthesized helm target. A referenced-secret credential materializes a
    Kubernetes Secret and publishes its locator; the synthesized Recipe
    references it as an env secretKeyRef so the broker's application-user
    password is set from the Secret and the plaintext never lands in the
    rendered manifest. Credentials are attachments on the features: pillar (each Feature is
    labeled feature.aggrega.ai/kind: secret), kept apart from application
    values.
spec:
  components:
    broker:
      type: core/messaging/rabbitmq
      features:
        password:
          type: core/referenced-secret
          values:
            key: RABBITMQ_PASSWORD
            origin: dev-broker-pw-change-me

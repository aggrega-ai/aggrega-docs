apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single RabbitMQ message broker, authored once and compiled to two
    targets: a Docker Compose service for local development and the Bitnami
    RabbitMQ Helm chart for Kubernetes. No credential is attached here, so each
    Recipe supplies a deterministic inline development password. The same
    developer intent drives both; only the Recipe layer selected by the
    Manifest differs.
spec:
  components:
    broker:
      type: core/messaging/rabbitmq

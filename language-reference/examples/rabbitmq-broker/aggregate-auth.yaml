apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same RabbitMQ broker, this time with a password credential attached to
    the component's `password` slot. When the credential is present the Recipe
    sets the broker's application-user password from the injected value: it
    feeds the chart's auth password on Kubernetes and the RABBITMQ_DEFAULT_PASS
    environment variable on Compose. Credentials live in the secrets: pillar
    (each Feature is labeled feature.aggrega.ai/kind: secret), kept apart from
    application values.
spec:
  components:
    broker:
      type: core/messaging/rabbitmq
      secrets:
        password:
          type: core/secret-value
          values:
            key: RABBITMQ_PASSWORD
            origin: dev-broker-pw-change-me

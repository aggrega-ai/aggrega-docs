apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same RabbitMQ broker, this time with an inject-value password credential
    attached to the component's `password` slot for the Compose target. When the
    credential is present the Recipe sets the broker's application-user password
    from the injected value, delivered as the RABBITMQ_DEFAULT_PASS environment
    variable. Credentials are attachments on the features: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    broker:
      type: core/messaging/rabbitmq
      features:
        password:
          type: core/secret-value
          values:
            key: RABBITMQ_PASSWORD
            origin: dev-broker-pw-change-me

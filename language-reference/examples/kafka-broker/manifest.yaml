apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target. Kafka is synthesized directly from
    the official image via the helm provider — the recipe emits a StatefulSet, a
    per-replica data volume, a ClusterIP Service, and a headless governing
    Service with no upstream chart pull. Recipe selection at build time is by
    component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/messaging/kafka:1.0.0: helm/kafka:1.0.0

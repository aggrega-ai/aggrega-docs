apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    An Apache Kafka single-node event-streaming broker for Kubernetes, authored
    once and compiled to a synthesized StatefulSet running the official Apache
    Kafka image. The node runs the broker and controller roles in one process
    (KRaft mode, no ZooKeeper); a producer or consumer connects to its client
    bootstrap endpoint and exchanges records there. The commit log persists to a
    local data volume, and the cluster identity is pinned so the rendered
    workload is byte-identical across builds.
spec:
  components:
    broker:
      type: core/messaging/kafka

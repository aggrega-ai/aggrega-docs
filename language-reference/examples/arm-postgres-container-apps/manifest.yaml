apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for Azure Resource Manager. The PostgreSQL component type binds
    the Recipe that deploys an Azure Database for PostgreSQL flexible server, the
    server type binds the Recipe that deploys an Azure Container Apps app, and
    the referenced-secret Feature binds the FeatureRecipe that points at a Key
    Vault secret.
spec:
  mappings:
    components:
      type:
        # Provider-qualified: each component type has a Recipe on more than one
        # target, and the mapping is what chooses this one.
        core/datastore/postgres:1.0.0: arm/postgres-flexible-server:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.0.0
    features:
      type:
        # The administrator's password is a Key Vault secret that already
        # exists. The FeatureRecipe renders no resource: it publishes the
        # secret's resource ID for the database Recipe to turn into a Key Vault
        # reference.
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0

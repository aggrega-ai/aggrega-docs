apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: orders-name-collision
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate-name-collision
  manifest: manifest
  boundaries:
    azure:
      directory: name-collision
      components:
        payments-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/orders-security/providers/Microsoft.KeyVault/vaults/orders-vault/secrets/orders-db-password
          infra:
            engine_version: "16"
            storage:
              size: 64Gi
              type: Premium_LRS
            ha:
              enabled: false
              read_replicas: 0
            overrides:
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/orders-network/providers/Microsoft.Network/virtualNetworks/orders-vnet/subnets/postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/orders-network/providers/Microsoft.Network/privateDnsZones/orders.postgres.database.azure.com
        payments--db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/orders-security/providers/Microsoft.KeyVault/vaults/orders-vault/secrets/ledger-db-password
          infra:
            engine_version: "16"
            storage:
              size: 64Gi
              type: Premium_LRS
            ha:
              enabled: false
              read_replicas: 0
            overrides:
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/orders-network/providers/Microsoft.Network/virtualNetworks/orders-vnet/subnets/postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/orders-network/providers/Microsoft.Network/privateDnsZones/orders.postgres.database.azure.com

apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A Contour ingress gateway for Kubernetes, authored once and compiled to a
    Contour Helm chart on Kubernetes. Contour is a Kubernetes-native ingress
    controller: it reconciles the cluster's Ingress and HTTPProxy resources and
    programs an Envoy data plane to serve client traffic. The developer names
    the ingress class the controller owns; applications route to the gateway by
    referencing that class in their own Ingress resources rather than through a
    wired edge, so the gateway declares no upstream use.
spec:
  components:
    gateway:
      type: core/gateway/contour
      values:
        ingress_class_name: contour

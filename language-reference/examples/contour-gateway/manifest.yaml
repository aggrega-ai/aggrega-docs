apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the official project-contour
    Helm chart. Contour is sourced from the project's HTTPS chart repository and
    rendered via the Helm SDK. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/gateway/contour:1.0.0: helm/contour:1.0.0

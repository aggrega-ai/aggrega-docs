apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A Jaeger single-node distributed-tracing backend for Kubernetes, authored
    once and compiled to a synthesized StatefulSet running the official Jaeger
    image. Jaeger receives trace spans over the OpenTelemetry protocol and
    answers trace-lookup and search queries over its query UI; an instrumented
    application pushes spans to its OTLP receiver and an operator reads them back
    from the UI. Trace data persists to a local embedded store on a data volume.
spec:
  components:
    tracing:
      type: core/observability/jaeger

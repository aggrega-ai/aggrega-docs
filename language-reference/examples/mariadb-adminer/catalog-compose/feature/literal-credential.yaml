apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: app/literal-credential
  version: 1.0.0
  description: >
    Injects one literal credential into the attached component's environment
    under a chosen variable name. Intended for local development and self-
    contained demos where credentials are supplied inline rather than sourced
    from a secret store. The value travels through the component's injection
    pipe and surfaces as an environment variable on the rendered workload.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      var:
        type: string
        required: true
        description: Environment variable name to set on the attached component.
      value:
        type: string
        required: true
        description: Literal value bound to the variable.

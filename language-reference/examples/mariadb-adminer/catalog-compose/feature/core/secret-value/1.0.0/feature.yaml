apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/secret-value
  version: 1.0.0
  description: >
    A single secret value delivered to the attached component. This is the
    credential interface: the developer names the value and, for local
    development, supplies it inline; the per-provider FeatureRecipe decides how
    it reaches the workload. The feature.aggrega.ai/kind: secret label names what
    it produces; it is attached on the component's features: pillar like any
    other Feature.
  labels:
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      # `key` names the delivery target; it is deliberately NOT sensitive. A
      # variable name is a locator for the material, not the material, and the
      # FeatureRecipe renders it in the clear as the delivery key.
      key:
        type: string
        required: true
        description: >
          Environment variable name the credential is delivered as on the
          consuming component (e.g. MARIADB_ROOT_PASSWORD).
      origin:
        type: string
        required: true
        sensitive: true
        description: >
          The secret value. Supplied inline here for local development; a
          production FeatureRecipe sources it from a secret store or Release
          parameter instead, so the plaintext never lives in the Aggregate.

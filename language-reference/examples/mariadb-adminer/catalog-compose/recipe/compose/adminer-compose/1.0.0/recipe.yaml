apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: adminer-compose
  version: 1.0.0
  description: >
    Adminer for local development via Docker Compose. Synthesized-mode
    Workload: image, environment, port, and the exposed service are
    translated from the Workload kind by the compose provider. The
    database host resolved from the `databases` uses-edge arrives on
    .context.inject.env and is rendered verbatim into the service env.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/devtool/adminer

  # The image serves Adminer on 8080, and nothing here moves that listener, so
  # the container port stays 8080 whatever port an operator sets. infra.port is
  # the port published on the host. A peer on the compose network connects to
  # this service by name on the container's own port, so provides.port is 8080.
  provides:
    host: "{{ .context.instance_id }}"
    port: "8080"

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "adminer:4"
        variables:
          ADMINER_DESIGN: "{{ .values.design }}"
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
        ports:
          http: 8080
    services:
      # NodePort publishes the port to the host (compose: "host:container";
      # Kubernetes: a NodePort Service) so the UI is reachable from a browser.
      # The entry's number, infra.port, is the host side and the container port
      # it names, http on 8080, the container side.
      default:
        type: NodePort
        ports:
          http: {{ optional .infra `port` 8080 }}

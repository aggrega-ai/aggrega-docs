apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: dotenv-secret
  version: 1.0.0
  description: >
    Compose implementation of core/secret-value. Inject-only: the injectMapping
    merges the value into the attached component's env pipe, so the component
    Recipe renders it as a docker-compose service environment entry. No resource
    is generated.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  target: compose
  implements: core/secret-value

  # Pre-render interception: deliver the value into the component inject pipe
  # under the chosen variable name. The base Recipe reads it as
  # .context.inject.env.<VAR>.
  injectMapping: |
    env:
      {{ .values.key }}: "{{ .values.origin }}"

apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: literal-credential-compose
  version: 1.0.0
  description: >
    Compose implementation of app/literal-credential. Pre-render
    interception: the injectMapping merges the chosen variable into the
    attached component's env pipe so the component Recipe renders it as a
    docker-compose service environment entry.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: compose
  implements: app/literal-credential

  injectMapping: |
    env:
      {{ .values.var }}: "{{ .values.value }}"

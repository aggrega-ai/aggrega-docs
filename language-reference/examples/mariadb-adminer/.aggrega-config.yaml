# Aggrega reads this file to find the root of your workspace. The workspace
# key below is what marks this directory as that root; everything else in
# this file is optional and layers on top of Aggrega's own defaults.
#
# Each Release builds against its own catalog variant, named here, so a build
# at a terminal, from an editor or by an assistant finds it with no flag.
workspace:
  releases:
    release-compose.yaml:
      catalog_dirs:
        - catalog-compose
    release-helm-synth.yaml:
      catalog_dirs:
        - catalog-helm-synth
    release-helm-bitnami.yaml:
      catalog_dirs:
        - catalog-helm-bitnami
    release-helm-chart.yaml:
      catalog_dirs:
        - catalog-helm-chart

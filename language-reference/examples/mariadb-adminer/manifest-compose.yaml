apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. Recipe selection at build
    time is by component type (spec.implements) against the loaded catalog
    layer; these mappings bind each type to its Recipe for this target, and
    a type left unmapped halts the build.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: compose/mariadb:1.0.0
        core/devtool/adminer:1.0.0: compose/adminer-compose:1.0.0
    features:
      type:
        core/secret-value:1.0.0: compose/dotenv-secret:1.0.0
        core/secret-provided:1.0.0: compose/provided-secret-compose:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm-chart
  version: 1.0.0
  description: >
    Composes a redistributable Helm umbrella chart. Each node bound to a
    helm-chart Recipe contributes its sourced sub-chart; the provider emits an
    umbrella Chart.yaml + values.yaml listing every contributor as a dependency,
    routing per-node values under the node's alias.
spec:
  plugin: hub.aggrega.ai/providers/helm-chart-renderer:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/secret-value
  version: 1.0.0
  description: >
    A single secret value delivered to the attached component. This is the
    credential interface: the developer names the value and, for local
    development, supplies it inline; the per-provider FeatureRecipe decides how
    it reaches the workload. Labeled feature.aggrega.ai/kind: secret, so the
    compiler routes it through the component's secrets: pillar, never features:.
  labels:
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      key:
        type: string
        required: true
        description: >
          Environment variable name the credential is delivered as on the
          consuming component (e.g. MARIADB_ROOT_PASSWORD).
      origin:
        type: string
        required: true
        description: >
          The secret value. Supplied inline here for local development; a
          production FeatureRecipe sources it from a secret store or Release
          parameter instead, so the plaintext never lives in the Aggregate.

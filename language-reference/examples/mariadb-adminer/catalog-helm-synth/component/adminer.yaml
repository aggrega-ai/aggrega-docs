apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: app/adminer
  version: 1.0.0
  description: >
    Adminer — a lightweight single-file database administration web UI.
    Connects to any stateful-server database wired through its `databases`
    uses-socket. The database host arrives on the injection context and the
    Recipe renders it as ADMINER_DEFAULT_SERVER so the login screen targets
    the right server. Login credentials are entered in the browser.
  labels:
    component.aggrega.ai/type: server
spec:
  # The component may inject resolved uses-edge values into env delivery.
  inject: [env]

  usesSchema:
    databases:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]

  schema:
    values:
      design:
        type: string
        default: pepa-linha-dark
        description: Adminer CSS theme name (ADMINER_DESIGN).
    infra:
      port:
        type: integer
        default: 8080
        description: Container HTTP port Adminer listens on.
    provides:
      host:
        type: string
      port:
        type: string

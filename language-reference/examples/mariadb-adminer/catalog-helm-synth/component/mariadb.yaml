apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/mariadb
  version: 1.0.0
  description: >
    A MariaDB relational database. Capability-agnostic: the same component
    is implemented by a Recipe per target, each in its own catalog layer of
    this example: Kubernetes Recipes (the Bitnami chart, a synthesized
    workload, a redistributable chart) and a Compose Recipe (local development).
  labels:
    component.aggrega.ai/type: stateful-server
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides
  # keys into env or file delivery mechanisms.
  inject: [env, file]

  # Credential slots. inject: [] = blackbox (Recipe controls delivery).
  # inject: [env, file] = transparent (developer may dictate delivery).
  # required: false is the default (omitted = optional).
  featuresSchema:
    root_password:
      required: true
      sensitive: true
      inject: []
      description: Root database password. Recipe controls delivery (Black-Box).
    user_password:
      sensitive: true
      inject: [env, file]
      description: Application user password, auto-generated if omitted.

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      database:
        type: string
        required: true
        description: Logical database name created on startup.
      version:
        type: string
        default: "11.4"
        description: MariaDB server version.
      chart_version:
        type: string
        description: >
          Source chart version, read by a managed-chart Recipe's source
          resolution (the Bitnami target). Authored in values to demonstrate a
          .values key flowing into source resolution.
      user:
        type: string
        description: Application-level database user (non-root). Omit for root-only access.
      charset:
        type: string
        default: utf8mb4
        description: Default character set.
      collation:
        type: string
        default: utf8mb4_general_ci
        description: Default collation.
      init_scripts:
        type: object
        valuesType: string
        description: SQL scripts executed on first database initialization. Each key is a filename, each value is the SQL content. Scripts run in alphabetical key order.
      custom_config:
        type: string
        description: Raw server configuration block (my.cnf format). Injected verbatim into the server configuration file.

    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3306
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (3306).
      engine_version:
        type: string
        default: "11.4"
        description: Server binary version.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      # Storage sizing is composed from the shared DbSizing SchemaLibrary via a
      # cross-library $ref. The library declares the size/type defaults, so they
      # materialize into the rendered output even when the Release omits them.
      storage:
        $ref: "DbSizing#/schemas/Storage"
      ha:
        enabled:
          type: boolean
          default: false
        read_replicas:
          type: integer
          min: 0
          default: 0
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
      port:
        type: string
      protocol:
        type: string
apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mariadb-synth
  version: 1.0.0
  description: >
    MariaDB on Kubernetes, rendered offline as plain manifests by the helm
    provider's Workload synthesis — no external chart. The Workload is
    form: stateful, so it becomes a StatefulSet with a per-replica
    volumeClaimTemplate for the data directory, a ClusterIP Service for
    consumers to dial, and the Headless Service that governs it. Credentials
    arrive on .context.inject.env from the attached core/secret-value Secrets.
    It runs one server, so infra.ha.enabled and a non-zero
    infra.ha.read_replicas halt the build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/datastore/mariadb

  # provides.host is provider-specific: the helm provider names the
  # synthesized Service "<rendered_name>-<service-key>", so the in-cluster DNS
  # name a consumer must dial is "<rendered_name>-default". The compose Recipe
  # names its service after the component alone — the same Aggregate edge
  # routes whichever string the bound Recipe emits.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "3306"
    protocol: "mariadb"

  # This Recipe runs one MariaDB server — the Workload below is one pod of the
  # official image with no replication configured — so a highly available
  # primary and read replicas are refused by name rather than dropped. The
  # managed-chart Recipe, helm/mariadb-bitnami, runs read replicas.
  assertions:
    no_high_availability: >-
      {{- if .infra.ha.enabled -}}
      {{- fail "infra.ha.enabled is true, and this Recipe runs one MariaDB server with no replica to fail over to: set infra.ha.enabled to false" -}}
      {{- end -}}
    no_read_replicas: >-
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe runs one MariaDB server: set infra.ha.read_replicas to 0, or map this component to helm/mariadb-bitnami, which runs read replicas beside the primary" .infra.ha.read_replicas) -}}
      {{- end -}}

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # A database keeps its state across restarts, so the Workload declares
    # form: stateful and the helm provider synthesizes a StatefulSet instead of
    # a Deployment. The form travels with two companions and all three move
    # together: the persistentTemplate volume below becomes a per-replica
    # volumeClaimTemplate (a plain persistent volume would stay one shared
    # PersistentVolumeClaim), and the Headless service supplies the stable
    # per-pod network identity the StatefulSet is governed by.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "mariadb:{{ .infra.engine_version }}"
        variables:
          MARIADB_DATABASE: "{{ .values.database }}"
          MARIADB_CHARACTER_SET_SERVER: "{{ .values.charset }}"
          MARIADB_COLLATION_SERVER: "{{ .values.collation }}"
          {{- if .values.user }}
          MARIADB_USER: "{{ .values.user }}"
          {{- end }}
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
        ports:
          mysql: 3306
        volumeMounts:
          - name: data
            path: /var/lib/mysql
    volumes:
      data:
        # persistentTemplate — not persistent — because the form above is
        # stateful: it renders as the StatefulSet's volumeClaimTemplate, so each
        # replica gets its own claim rather than sharing one.
        persistentTemplate:
          # The Component's storage schema (composed from the DbSizing
          # SchemaLibrary) materializes the size default, so the Recipe reads
          # the resolved infra value directly rather than carrying its own.
          size: "{{ .infra.storage.size }}"
    services:
      # default is the address consumers dial — the name provides.host emits.
      default:
        type: ClusterIP
        ports:
          mysql: 3306
      # Exactly one Headless service must accompany a stateful Workload: it is
      # what gives each replica a stable DNS name, and the synthesized
      # StatefulSet names it as its governing service.
      headless:
        type: Headless
        ports:
          mysql: 3306

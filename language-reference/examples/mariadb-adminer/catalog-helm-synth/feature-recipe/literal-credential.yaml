apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: literal-credential-helm
  version: 1.0.0
  description: >
    Helm implementation of app/literal-credential. Pre-render interception:
    the injectMapping merges the chosen variable into the attached
    component's env pipe so the component Recipe renders it as a container
    environment variable on the synthesized Deployment / StatefulSet.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: helm
  implements: app/literal-credential

  injectMapping: |
    env:
      {{ .values.var }}: "{{ .values.value }}"

apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: provided-secret
  version: 1.0.0
  description: >
    Helm implementation of core/secret-provided. Exposes the value as the
    `value` provides key; the attachment's inject: block on the component maps
    it to a delivery target. No injectMapping — delivery is developer-dictated (the
    transparent slot), not Recipe-controlled.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/secret-provided
  provides:
    value: "{{ .values.origin }}"

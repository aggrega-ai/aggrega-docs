apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mariadb-bitnami
  version: 1.0.0
  description: >
    MariaDB via Bitnami Helm chart (bitnami/mariadb). The chart version is read
    from .values.chart_version — a developer-authored value flowing from the
    Aggregate into source resolution.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/datastore/mariadb

  source:
    kind: helm-oci-chart
    # OCI chart reference: registry path plus the chart name.
    url: oci://registry-1.docker.io/bitnamicharts/mariadb
    # Chart version read from a developer-authored value: it flows from the
    # Aggregate into source resolution and pins identically at lock and build.
    version: "{{ .values.chart_version }}"

  locals:
    primary_compute: "mariadb"

  provides:
    # The Bitnami chart names its primary Service <release>-mariadb, where the
    # release name is the component instance — so a consumer dials
    # "<instance_id>-mariadb" (e.g. "db-mariadb"), NOT the bare instance id. The
    # compose and self-contained Kubernetes targets name their services
    # differently; each target's provides.host reflects its own service naming,
    # and the same Aggregate edge routes whichever string this Recipe emits.
    host: "{{ .context.instance_id }}-mariadb"
    port: "3306"
    protocol: "mariadb"

  valuesMapping: |
    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- if .infra.overrides.volume_permissions_image }}
    volumePermissions:
      image:
        {{- range $k, $v := .infra.overrides.volume_permissions_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
    {{- end }}
    {{- if .infra.overrides.global_storage_class }}
    global:
      storageClass: "{{ .infra.overrides.global_storage_class }}"
    {{- end }}
    {{- end }}

    ## ── Authentication ─────────────────────────────────────────
    ## The credential Secrets deliver the passwords into the component inject
    ## pipe (.context.inject.env); the chart reads them inline. No Kubernetes
    ## Secret is generated here — that is the production resource-generation path.
    auth:
      database: "{{ .values.database }}"
      rootPassword: "{{ .context.inject.env.MARIADB_ROOT_PASSWORD }}"
      {{- if .values.user }}
      username: "{{ .values.user }}"
      password: "{{ .context.inject.env.MARIADB_PASSWORD }}"
      {{- end }}

    ## ── Primary ────────────────────────────────────────────────
    primary:
      {{- if .values.custom_config }}
      configuration: |-
        {{ .values.custom_config | nindent 8 }}
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if .infra.overrides }}
        {{- if .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}
        {{- end }}

      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        storageClass: "{{ .infra.storage.type }}"
        accessModes:
          - ReadWriteOnce

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- if .infra.overrides.affinity }}
      affinity: {{ toJson .infra.overrides.affinity }}
      {{- end }}
      {{- if .infra.overrides.service_type }}
      service:
        type: "{{ .infra.overrides.service_type }}"
      {{- end }}
      {{- end }}

    ## ── Init scripts ───────────────────────────────────────────
    {{- if .values.init_scripts }}
    initdbScripts:
      {{- range $name, $sql := .values.init_scripts }}
      {{ $name }}: |
        {{ $sql | nindent 8 }}
      {{- end }}
    {{- end }}

    ## ── Secondary (HA) ─────────────────────────────────────────
    secondary:
      {{- if and .infra.ha.enabled (gt (int .infra.ha.read_replicas) 0) }}
      replicaCount: {{ .infra.ha.read_replicas }}
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        storageClass: "{{ .infra.storage.type }}"
      {{- else }}
      replicaCount: 0
      {{- end }}

    ## ── Metrics ────────────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.metrics }}
    metrics:
      enabled: true
      {{- if .infra.overrides.metrics.image }}
      image:
        {{- range $k, $v := .infra.overrides.metrics.image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}

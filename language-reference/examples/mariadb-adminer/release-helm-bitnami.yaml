apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: k8s-bitnami
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-bitnami
  boundaries:
    app:
      directory: app
      components:
        db:
          # Operational sizing owned by the operator. Set explicitly so the
          # Bitnami chart values render without relying on schema defaults.
          infra:
            engine_version: "11.4"
            compute:
              cpu: 500m
              memory: 1Gi
            storage:
              size: 8Gi
              type: standard
            ha:
              enabled: false
              read_replicas: 0
        web:
          infra:
            port: 8080

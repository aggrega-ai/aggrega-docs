apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A MariaDB database with an Adminer web UI in front of it. This is the
    single Developer-authored intent surface. The same Aggregate compiles
    to Docker Compose and to Kubernetes/Helm; only the loaded Recipe layer
    differs per target.
spec:
  components:
    # ── Database ────────────────────────────────────────────────────────
    db:
      type: core/datastore/mariadb
      values:
        database: appdb
        user: appuser
        charset: utf8mb4
        collation: utf8mb4_general_ci
        # Developer-pinned chart version. The Bitnami target's Recipe reads this
        # as .values.chart_version in its source resolution — a value flowing
        # from the Aggregate into a Recipe source. Chart-version pinning is
        # normally an operational concern (infra.source_version); it is authored
        # here only to demonstrate the values-in-source mechanism.
        chart_version: "25.0.8"
      # Credentials are attachments on the features: pillar like any other
      # Feature; the feature.aggrega.ai/kind: secret label names what they
      # produce. The two slots the Component's featuresSchema declares
      # demonstrate both delivery models:
      #
      #   - root_password is a BLACK-BOX slot (featuresSchema inject: []): the
      #     FeatureRecipe controls delivery, injecting the value straight into
      #     the component's pipe. The developer may not dictate delivery.
      #   - user_password is a TRANSPARENT slot (featuresSchema inject:
      #     [env, file]): the credential exposes its value as a `provides` key,
      #     and the developer dictates delivery with the attachment's inject:
      #     block below.
      #
      # Either way the value lands on .context.inject.env.<VAR>, which the
      # database Recipe reads.
      features:
        root_password:
          type: core/secret-value
          values:
            key: MARIADB_ROOT_PASSWORD
            origin: dev-root-pw-change-me
        user_password:
          type: core/secret-provided
          values:
            origin: dev-app-pw-change-me
          inject:
            env:
              - in: MARIADB_PASSWORD
                from: value

    # ── Web UI ──────────────────────────────────────────────────────────
    web:
      type: core/devtool/adminer
      values:
        design: pepa-linha-dark
      # The String Pipe: db.provides.host is wired into Adminer's
      # ADMINER_DEFAULT_SERVER. The compiler does not interpret the string;
      # it routes whatever the database Recipe's `provides.host` emits
      # (a compose service name, or a Kubernetes service DNS name).
      uses:
        databases:
          db:
            target: db
            inject:
              env:
                - in: ADMINER_DEFAULT_SERVER
                  from: host

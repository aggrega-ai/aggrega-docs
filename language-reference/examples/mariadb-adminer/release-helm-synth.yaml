apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: k8s-synth
  environment: development
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  boundaries:
    app:
      directory: app
      components:
        db:
          infra:
            engine_version: "11.6"
            storage:
              size: 4Gi
        web:
          infra:
            port: 8082

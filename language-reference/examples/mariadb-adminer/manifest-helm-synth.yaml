apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the self-contained Kubernetes target. MariaDB and
    Adminer are rendered offline by the helm provider's Workload synthesis
    (no external chart). Recipe selection at build time is by component type
    against the loaded catalog layer; these mappings record the intended
    Recipe per type for this target.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: mariadb-synth:1.0.0
        app/adminer:1.0.0: adminer-helm:1.0.0
    features:
      type:
        core/secret-value:1.0.0: env-secret-helm:1.0.0
        core/secret-provided:1.0.0: provided-secret-helm:1.0.0

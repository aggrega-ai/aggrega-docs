apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: compose-dev
  environment: development
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-compose
  boundaries:
    app:
      directory: app
      components:
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 2Gi
        web:
          infra:
            port: 8080

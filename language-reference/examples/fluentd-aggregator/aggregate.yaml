apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A Fluentd log aggregator — the receiving end of a log pipeline — authored
    once and compiled to two targets: a Docker Compose stack for local
    development and the official fluent/fluentd image synthesized for
    Kubernetes. The aggregator listens on the `forward` input protocol and
    routes the records it receives to its output. It exports the host and port
    of its forward endpoint through `provides`, so an upstream forwarder can
    bind it and ship records to it. The same developer intent drives both
    targets; only the Recipe layer selected by the Manifest differs.
spec:
  components:
    aggregator:
      type: core/observability/fluentd

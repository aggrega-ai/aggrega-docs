apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-bitnami
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the Bitnami Fluentd Helm
    chart. Fluentd is sourced from an OCI chart and rendered via the Helm SDK in
    aggregator mode — the forwarder daemonset is disabled, so the chart renders
    only the aggregator StatefulSet and its supporting resources. Recipe
    selection at build time is by component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/fluentd:1.0.0: fluentd-bitnami:1.0.0

apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Fluentd type is realized by
    the compose Recipe, which synthesizes a service running Fluentd with a
    `forward` input source. The recipe reference is provider-scoped because a
    helm Recipe of the same name also exists. Recipe selection at build time is
    by component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/fluentd:1.0.0: compose/fluentd:1.0.0

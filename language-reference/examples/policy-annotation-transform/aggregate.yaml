apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: shop
  version: "1.0.0"
  description: >
    Three HTTP services. None carries an annotation or a features: block: the
    monitoring and the IAM role each one ends with are attached by a governance
    policy the operator attaches, through the Manifest's annotation bindings.
spec:
  components:
    api: { type: example/compute/service }
    worker: { type: example/compute/service }
    gateway: { type: example/compute/service }

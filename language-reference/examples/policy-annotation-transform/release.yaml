apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: shop-production
  environment: production
  version: "1.0.0"
spec:
  aggregate: shop
  manifest: shop-manifest
  boundaries:
    shop:
      directory: shop
      annotations:
        aggrega.ai/namespace: shop
      components:
        # No annotation here: the policy injects both.
        api: {}
        worker: {}
        # The operator writes gateway's monitoring by hand, with a shorter
        # interval. The policy leaves a key the component already carries alone,
        # so it injects only aws-role here.
        gateway:
          annotations:
            feature.aggrega.ai/monitoring:
              interval: 10s
              port: metrics
              path: /metrics

# The policy, attached through the CEL engine. A build names this file with
# --config:
#
#   aggrega build --release release.yaml --config governance-cel.yaml
#
# --config names the global configuration file for that run, in place of the
# one this machine would otherwise read, and the workspace's own
# .aggrega-config.yaml still layers on top of it. A relative path under
# with.sources resolves against the directory of this file.
#
# governance-rego.yaml attaches the same policy through the Rego engine.
plugins:
  governance:
    - uri: governance/cel:0.8.6
      role: annotation-transform
      with:
        sources:
          - policies/platform-defaults.cel

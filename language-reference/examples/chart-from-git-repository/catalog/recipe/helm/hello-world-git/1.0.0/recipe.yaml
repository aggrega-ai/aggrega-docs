apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: hello-world-git
  version: 1.0.0
  description: >
    The generic long-running server realized by a Helm chart that lives in a git
    repository rather than in a chart registry. The source names three things:
    the repository to clone, the reference to read it at, and the directory
    inside that repository which is the chart.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/compute/server:1.0.0

  source:
    kind: git-repository
    url: https://github.com/helm/examples.git
    # The reference is the coordinate an author writes, and it is the one a
    # later build looks this artifact up by. A tag is a name the repository can
    # repoint at a different commit, so the lockfile records the commit this
    # reference resolved to; a later pull that finds the reference resolving
    # somewhere else halts rather than adopting the new commit in silence.
    #
    # It is whatever the repository's own authors named, which is not always a
    # bare version — here the tag carries the chart's name as well.
    ref: hello-world-0.1.0
    # The repository is not itself a chart: it holds one under this directory.
    # The directory is part of what makes the artifact distinct, because two
    # directories of one repository at one commit are two artifacts, not one.
    module_subdir: charts/hello-world

  # The component declares no provides, so this realization publishes nothing
  # across an edge.
  provides: {}

  valuesMapping: |
    replicaCount: {{ .infra.replicas }}

    {{- /*
      The component carries one image string; the chart takes a repository and a
      tag as separate values. Split it once, here, so both halves derive from
      the same authored value and cannot drift apart.
    */}}
    {{- $image := splitList ":" .infra.image }}
    image:
      repository: "{{ first $image }}"
      tag: "{{ last $image }}"

    service:
      port: {{ .infra.port }}

apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: chart-from-git-repository
  version: "1.0.0"
  description: >
    One long-running server. The developer declares an operational type and
    nothing about where its packaging comes from: whether the Recipe behind it
    synthesizes a workload, pulls a chart from a registry, or reads one out of a
    git repository is an Ops decision, taken in the Recipe and bound by the
    Manifest. This Aggregate is identical to one whose server is realized any
    other way.
spec:
  components:
    web:
      type: core/compute/server

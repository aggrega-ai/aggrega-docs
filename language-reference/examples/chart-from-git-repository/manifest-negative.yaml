apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: chart-from-git-repository-negative-manifest
  version: "1.0.0"
  description: >
    The guardrail variant: the same developer intent bound to the Recipe whose
    source names a reference the repository does not carry. Everything else is
    identical, so the refusal is attributable to the reference and to nothing
    else.
spec:
  mappings:
    components:
      type:
        core/compute/server: helm/hello-world-git-missing-ref:1.0.0

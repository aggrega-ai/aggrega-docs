apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: chart-from-git-repository-manifest
  version: "1.0.0"
  description: >
    Binds the generic server primitive to the Recipe that reads its chart out of
    a git repository. Swapping this one line for a Recipe that pulls the same
    chart from a registry, or one that synthesizes a workload with no chart at
    all, changes where the packaging comes from and nothing the developer wrote.
spec:
  mappings:
    components:
      type:
        core/compute/server: helm/hello-world-git:1.0.0

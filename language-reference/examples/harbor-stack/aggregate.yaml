apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A container registry, imported as a reusable module. The module is a
    sub-aggregate composing one component, which describes the whole registry —
    its API and token-service control plane, its OCI blob store and controller,
    its web console, its worker tier, its vulnerability scanner, its relational
    backend, its key-value cache, and the reverse proxy fronting them — as a
    single unit deployed from the registry's own Helm chart. One in-cluster
    address serves the console path and the registry and API paths, and the
    module exports it under both of its public names: `registry`, the endpoint
    image clients and the API talk to, and `ui`, the web endpoint. This
    top-level Aggregate imports the module by name; the operator sizes the
    module's component in the Release.
spec:
  aggregates:
    harbor:
      type: core/harbor

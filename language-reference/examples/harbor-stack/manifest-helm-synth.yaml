apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target. The one component the container-registry
    module composes is realized by the Recipe that wraps the registry's own Helm
    chart: the Recipe declares the chart and the values it overlays, and the Helm
    provider renders the chart's templates into manifests. The module attaches
    the core/referenced-secret credential Feature to four of the component's
    credential slots, and the Release attaches it to three more, so the Feature
    is mapped here too: bound to k8s-existing-secret, each attachment names a
    Secret that already exists in the namespace and no key is rendered. The one
    exception is the administrator's password, which this example leaves at the
    module's development default: that attachment is bound by name to
    k8s-secret-from-parameter, which reads the parameter as the password itself
    and emits a Secret carrying it. Recipe selection at build time is by
    component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/devtool/harbor:1.0.0: helm/harbor-chart:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: helm/k8s-existing-secret:1.0.0
      name:
        admin_password: helm/k8s-secret-from-parameter:1.0.0

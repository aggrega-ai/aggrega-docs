apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target. The one component the container-registry
    module composes is realized by the Recipe that wraps the registry's own Helm
    chart: the Recipe declares the chart and the values it overlays, and the Helm
    provider renders the chart's templates into manifests. The module attaches
    the core/referenced-secret credential Feature to the component's four
    credential slots, so the Feature is mapped here too: bound to
    k8s-secret-from-parameter, it reads each of the module's credential
    parameters as the credential itself and emits a Secret carrying it, which
    suits an evaluation stack running on the module's development defaults.
    Recipe selection at build time is by component type against the loaded
    catalog.
spec:
  mappings:
    components:
      type:
        core/devtool/harbor:1.0.0: helm/harbor-chart:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: k8s-secret-from-parameter:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by synthesized manifests. Each
    Harbor component type and the two datastore types are realized by their
    synth helm Recipes — the core, portal, and job service as stateless
    Deployments, the distribution registry and the PostgreSQL backend as
    StatefulSets with persistent volumes, and the cache as a stateless
    Deployment. Recipe selection at build time is by component type against the
    loaded catalog.
spec:
  mappings:
    components:
      type:
        core/devtool/harbor-core:1.0.0: helm/harbor-core:1.0.0
        core/devtool/harbor-registry:1.0.0: helm/harbor-registry:1.0.0
        core/devtool/harbor-portal:1.0.0: helm/harbor-portal:1.0.0
        core/devtool/harbor-jobservice:1.0.0: helm/harbor-jobservice:1.0.0
        core/datastore/postgres:1.0.0: helm/postgres:1.0.0
        core/datastore/valkey:1.0.0: helm/valkey:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: k8s-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  boundaries:
    app:
      directory: app
      components:
        # The module's component is addressed by its dotted module-scoped id.
        # Compute sizing is owned by the operator: the control plane is sized
        # here, and the port, the image tag and the blob store's volume are left
        # to the component's schema defaults, so the stack renders
        # self-contained.
        #
        # Both keys of the compute group are set together. The Recipe halts on a
        # group that carries only one of them, because a control plane rendered
        # with a CPU limit and no memory limit is materially different from the
        # one the component's declared defaults describe, and nothing in the
        # output would say so.
        harbor.registry:
          infra:
            compute:
              cpu: 500m
              memory: 1Gi

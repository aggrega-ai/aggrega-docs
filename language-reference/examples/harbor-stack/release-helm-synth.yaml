apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: k8s-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  boundaries:
    app:
      directory: app
      components:
        # The module's internal components are addressed by their dotted
        # module-scoped IDs, and all are placed in this boundary so the stack
        # renders into one directory. Compute sizing is owned by the operator;
        # the core and the backend are sized here, and storage and everything
        # else is left to the components' schema defaults, so the stack renders
        # self-contained.
        harbor.core:
          infra:
            compute:
              cpu: 500m
              memory: 1Gi
        harbor.db:
          infra:
            compute:
              cpu: 500m
              memory: 512Mi
        harbor.registry: {}
        harbor.portal: {}
        harbor.jobservice: {}
        harbor.cache: {}

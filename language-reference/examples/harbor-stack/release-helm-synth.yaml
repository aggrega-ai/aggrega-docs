apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: k8s-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-helm-synth
  # The Secrets holding three of the registry's keys, which the Aggregate passes
  # down to the module. The Manifest binds the credential to an existing
  # Secret, so each names one rather than carrying the key: create them in the
  # target namespace, each key under the data key its parameter names, before
  # applying the rendered manifests.
  parameters:
    csrf_key: harbor-csrf-key
    jobservice_secret: harbor-jobservice-secret
    registry_http_secret: harbor-registry-http-secret
  boundaries:
    app:
      directory: app
      components:
        # The module's component is addressed by its dotted module-scoped id.
        # Compute sizing is owned by the operator: the control plane is sized
        # here, and the port, the image tag and the blob store's volume are left
        # to the component's schema defaults.
        #
        # Both keys of the compute group are set together. The Recipe halts on a
        # group that leaves either of them empty, because a control plane rendered
        # with a CPU limit and no memory limit is materially different from the
        # one the component's declared defaults describe, and nothing in the
        # output would say so.
        #
        # The token-signing key, the services' shared secret and the key stored
        # credentials are encrypted with have no default, and the build halts
        # until each slot is filled. The module attaches none of them, so the
        # Release attaches them here, each naming a Secret that already exists
        # in the namespace — the Manifest binds them to k8s-existing-secret.
        # Create the Secrets before applying the rendered manifests; the README
        # shows how.
        harbor.registry:
          infra:
            compute:
              cpu: 500m
              memory: 1Gi
          features:
            token_key:
              type: core/referenced-secret
              infra:
                origin: harbor-token-key
            core_secret:
              type: core/referenced-secret
              infra:
                origin: harbor-core-secret
            secret_key:
              type: core/referenced-secret
              infra:
                origin: harbor-secret-key

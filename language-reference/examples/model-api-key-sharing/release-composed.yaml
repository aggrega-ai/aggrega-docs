apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: model-api-key-sharing-composed
  environment: production
  version: "1.0.0"
spec:
  aggregate: model-api-key-sharing-composed
  # The existing-secret mapping, as in the shared release.
  manifest: model-api-key-sharing-existing-secret-manifest
  boundaries:
    main:
      directory: composed
      components:
        gateway:
          infra:
            endpoint: https://gateway.internal.example:8080/v1
        researcher:
          infra:
            image: registry.example/crew-researcher:1.4.0
        writer:
          infra:
            image: registry.example/crew-writer:1.4.0

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: model-api-key-sharing-manifest
  version: "1.0.0"
  description: >
    One helm Ops mapping shared by all three releases. The three forms differ
    only in where the credential is attached, never in how it is realized, so
    the same mapping serves each: the agent binds to the crewai helm Recipe, the
    gateway to the openai-compatible helm Recipe, and the credential to
    k8s-secret-from-parameter, which materializes a Kubernetes Secret and
    publishes its locator for the agent to reference.
spec:
  mappings:
    components:
      type:
        core/ai-agent/crewai: helm/crewai:1.0.0
        core/ai-model/openai-compatible: helm/openai-compatible:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: k8s-secret-from-parameter:1.0.0

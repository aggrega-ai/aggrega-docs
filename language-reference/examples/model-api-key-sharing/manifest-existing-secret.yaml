apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: model-api-key-sharing-existing-secret-manifest
  version: "1.0.0"
  description: >
    The helm Ops mapping for the shared and composed releases. The components
    bind as in the per-consumer mapping; the credential binds to
    k8s-existing-secret, which renders nothing and publishes the name its origin
    carries, so every connection naming one Secret references that one Secret.
spec:
  mappings:
    components:
      type:
        core/ai-agent/crewai: helm/crewai:1.0.0
        core/ai-model/openai-compatible: helm/openai-compatible:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: helm/k8s-existing-secret:1.0.0

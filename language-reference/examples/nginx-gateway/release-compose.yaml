apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: local-compose
  environment: development
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-compose
  boundaries:
    app:
      directory: app
      components:
        web:
          infra:
            port: 8080
        proxy:
          infra:
            # Published on its own host port: the backend already takes 8080.
            port: 8000
            engine_version: "1.27.5-alpine"

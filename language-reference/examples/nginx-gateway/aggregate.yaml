apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    An NGINX reverse-proxy gateway fronting a web backend, authored once and
    compiled to two targets: a Docker Compose stack for local development and
    synthesized Kubernetes manifests running the official nginx image. The gateway declares an
    `upstream` use of the backend; the backend Recipe's provides host and port
    are piped into the gateway and rendered into its proxy_pass target. The same
    developer intent drives both; only the Recipe layer selected by the Manifest
    differs.
spec:
  components:
    web:
      type: core/devtool/adminer
    proxy:
      type: core/gateway/nginx
      uses:
        upstream:
          web:
            target: web
            inject:
              env:
                - in: NGINX_UPSTREAM_HOST
                  from: host
                - in: NGINX_UPSTREAM_PORT
                  from: port

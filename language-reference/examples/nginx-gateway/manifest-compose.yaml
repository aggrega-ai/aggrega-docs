apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The NGINX gateway type is
    realized by the compose Recipe, and the web backend by the Adminer compose
    Recipe. Recipe selection at build time is by component type against the
    loaded catalog.
spec:
  mappings:
    components:
      type:
        core/gateway/nginx:1.0.0: compose/nginx:1.0.0
        core/devtool/adminer:1.0.0: compose/adminer:1.0.0

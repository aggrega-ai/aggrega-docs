workspace:
  catalog_dirs:
    # The workspace's own catalog first: the two teaching Recipes the guardrail
    # Releases bind, each a variant of the standard-library Recipe under a name
    # of its own, so neither shadows it. Then the standard-library catalog,
    # which supplies the Component and the Recipe the two passing Releases use.
    - ./catalog
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer removes the sibling catalog entry above and
# resolves catalog entities from the hub registry.
default_registry: hub.aggrega.ai

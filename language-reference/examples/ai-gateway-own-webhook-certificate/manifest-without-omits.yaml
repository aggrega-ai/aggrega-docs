apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-gateway-own-webhook-certificate-without-omits-manifest
  version: "1.0.0"
  description: >
    The first guardrail variant: the same developer intent bound to the
    workspace's own Recipe that sources the same chart and carries no omits
    entry, so in the own-certificate mode the Secret the chart generates
    reaches the output.
spec:
  mappings:
    components:
      type:
        core/gateway/envoy-ai-gateway-operator:1.0.0: helm/envoy-ai-gateway-operator-without-omits:1.0.0

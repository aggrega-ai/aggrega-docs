#
# Expected to FAIL when built with --verify-determinism. It is the
# own-certificate Release deployed through the Manifest that binds the Recipe
# with no omits entry, so the Secret the chart generates afresh on every render
# reaches the output and two renders of the controller differ.

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-gateway-own-webhook-certificate-negative-without-omits
  environment: production
  version: "1.0.0"
spec:
  aggregate: ai-gateway-own-webhook-certificate
  manifest: ai-gateway-own-webhook-certificate-without-omits-manifest
  components:
    ai-controller:
      annotations:
        aggrega.ai/namespace: envoy-ai-gateway-system
      infra:
        webhook_tls_secret: ai-gateway-webhook-tls

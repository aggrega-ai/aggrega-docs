apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-gateway-own-webhook-certificate-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target: the AI gateway controller is routed
    to the standard-library Recipe, which renders it in either certificate mode
    and leaves out the Secret the chart generates in the own-certificate mode.
spec:
  mappings:
    components:
      type:
        core/gateway/envoy-ai-gateway-operator:1.0.0: helm/envoy-ai-gateway-operator:1.0.0

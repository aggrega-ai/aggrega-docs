apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-gateway-own-webhook-certificate
  version: "1.0.0"
  description: >
    The Envoy AI Gateway control plane on its own. Where the certificate its
    webhook serves comes from is decided by each Release, so this file is the
    same for every Release in the workspace.
spec:
  components:
    # ── The AI gateway controller ───────────────────────────────────────────
    # Envoy AI Gateway's control plane: the controller Envoy Gateway calls as
    # its extension server, the webhook adding the AI external processor to
    # the gateway's data plane, and the six AI Gateway resource definitions.
    ai-controller:
      type: core/gateway/envoy-ai-gateway-operator

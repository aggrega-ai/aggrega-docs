apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: adhoc-uses-socket-local
  environment: development
  version: "1.0.0"
spec:
  aggregate: adhoc-uses-socket-delivers
  manifest: adhoc-uses-socket-manifest
  # Single scope: components are authored directly, no boundaries block, so the
  # compiler folds them into the synthesized default boundary and emits flat
  # under dist/.
  #
  # Note what is absent. A Release may wire and configure an edge within a
  # socket the Component declares, but it may not name a socket the Component
  # does not — that surface stayed closed when the Aggregate's own uses: opened.
  # The `assistant` socket is the Aggregate author's, and only theirs.
  components:
    db:
      infra:
        engine_version: "11.4"
        storage:
          size: 2Gi
    # Every component the Aggregate declares is named under a boundary, this
    # one included. A boundary is a grouping of what a Release deploys, not a
    # promise that a container starts for each member — so a reference-form
    # realization is placed like any other, and carries no infra because there
    # is no physical sizing to give it.
    model:
      description: >
        The model endpoint. No compute is deployed for it, so there is nothing
        to size; naming it here places it in the same single scope as the
        components that do run.
    web:
      infra:
        port: 8080

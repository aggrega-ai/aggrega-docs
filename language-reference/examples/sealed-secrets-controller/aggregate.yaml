apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A sealed-secrets controller for Kubernetes, authored once and compiled to
    the official sealed-secrets Helm chart. sealed-secrets decrypts SealedSecret
    custom resources into native Kubernetes Secrets using a private key the
    controller holds in the cluster, so encrypted secret material can be
    committed to source control safely. It extends the cluster with its own
    SealedSecret custom resource; applications consume it by declaring
    SealedSecret resources rather than by wiring a topology edge.
spec:
  components:
    sealed-secrets:
      type: core/security/sealed-secrets

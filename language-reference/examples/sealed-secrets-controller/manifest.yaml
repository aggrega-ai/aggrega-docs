apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the official sealed-secrets
    Helm chart. sealed-secrets is sourced from an HTTPS chart repository and
    rendered via the Helm SDK. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/security/sealed-secrets:1.0.0: helm/sealed-secrets:1.0.0

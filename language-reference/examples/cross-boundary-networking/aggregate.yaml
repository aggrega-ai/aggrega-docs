apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: cross-boundary-app
  version: "1.0.0"
  description: >
    A two-component stack — an Adminer database UI and a PostgreSQL database —
    that a Release splits across two boundaries. Adminer declares a `backend`
    use of the database and injects the database host into
    ADMINER_DEFAULT_SERVER. This single developer intent deploys two ways: the
    compose Release adds core/compose-bridge to cross the network seam, and the
    helm Release crosses the namespace seam with native cross-namespace DNS — no
    bridge. The Aggregate is identical for both; only the Ops/Operator layer
    (provider, catalog, Release) differs.
spec:
  components:
    adminer:
      type: app/adminer
      uses:
        backend:
          primary:
            target: db
            inject:
              env:
                - in: ADMINER_DEFAULT_SERVER
                  from: host
    db:
      type: core/postgres

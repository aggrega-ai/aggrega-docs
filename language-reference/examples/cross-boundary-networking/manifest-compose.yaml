apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: cross-boundary-compose-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the compose variant. The catalog loaded at build time
    contains exactly one Recipe per component type and one FeatureRecipe
    implementing core/compose-bridge, so recipe selection resolves unambiguously
    by `implements` — no explicit per-type mappings are needed.
spec: {}

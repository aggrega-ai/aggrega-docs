apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: cross-boundary-helm-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the helm variant. The catalog loaded at build time contains
    exactly one Recipe per component type, so recipe selection resolves
    unambiguously by `implements` — no explicit per-type mappings are needed.
spec:
  mappings:
    components:
      type:
        app/adminer: adminer-helm:1.0.0
        core/datastore/postgres: db-helm:1.0.0

apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: cross-boundary-helm-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the helm variant. Recipe and FeatureRecipe selection is by
    explicit Manifest mapping: each component type binds to its Recipe and each
    feature type to its FeatureRecipe.
spec:
  mappings:
    components:
      type:
        core/devtool/adminer: helm/adminer-helm:1.0.0
        core/datastore/postgres: helm/postgres:1.0.0
    features:
      type:
        core/k8s-dns-resolver:1.0.0: helm/k8s-dns-resolver:1.0.0

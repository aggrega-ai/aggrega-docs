apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: app/adminer
  version: "1.0.0"
  description: >
    Adminer — a single-file database administration web UI. It reaches a
    database across a compose network seam: it declares a `backend` uses-edge
    to a stateful-server and injects the resolved host into its
    ADMINER_DEFAULT_SERVER environment variable, which pre-fills Adminer's
    login server. When a boundary attaches core/compose-bridge, that value is
    rewritten to the gateway address so the connection crosses the seam.
  labels:
    component.aggrega.ai/type: "server"
spec:
  inject: ["env"]
  usesSchema:
    backend:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: ["env"]
  schema:
    infra:
      port: { type: integer, default: 8080 }
    provides:
      host: { type: string, required: true }
      port: { type: integer, required: true }

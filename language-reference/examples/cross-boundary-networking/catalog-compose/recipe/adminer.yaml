apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: adminer-recipe
  version: "1.0.0"
  description: >
    Adminer for the `frontend` boundary via Docker Compose, sourced-mode: the
    service skeleton is loaded from the co-located adminer-fragment.yaml and the
    valuesMapping overlay supplies the published port and the
    ADMINER_DEFAULT_SERVER environment variable. ADMINER_DEFAULT_SERVER arrives
    on the injection context from the `databases` uses-edge (the database host);
    the boundary-scope compose-bridge then rewrites it to "aggrega-gw:<port>"
    (the derived gateway port) so Adminer reaches the database across the
    compose network seam.
spec:
  capability: compose
  implements: core/devtool/adminer
  provides:
    host: "{{ .context.instance_id }}"
    port: 8080
  source: "./adminer-fragment.yaml"
  valuesMapping: |
    services:
      adminer:
        ports:
          - "{{ optional .infra `port` 8080 }}:8080"
        environment:
          ADMINER_DEFAULT_SERVER: "{{ .context.inject.env.ADMINER_DEFAULT_SERVER }}"

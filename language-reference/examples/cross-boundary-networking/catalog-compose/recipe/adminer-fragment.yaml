# Sourced compose fragment for the adminer component. Loaded as literal YAML
# (sourced-mode Render — no template evaluation at this stage); the adminer
# Recipe's valuesMapping overlay supplies the templated fields (the published
# port and the ADMINER_DEFAULT_SERVER environment variable). The compose
# deep-merge combines the two: the image stays from this fragment, ports +
# environment come from the overlay.
services:
  adminer:
    image: adminer:4

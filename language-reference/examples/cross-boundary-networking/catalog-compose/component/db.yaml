apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/postgres
  version: "1.0.0"
  description: >
    A PostgreSQL database. Lives in its own boundary (its own compose network
    seam) and exports its host/port to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: "stateful-server"
spec:
  inject: ["env"]
  schema:
    provides:
      host: { type: string, required: true }
      port: { type: integer, required: true }

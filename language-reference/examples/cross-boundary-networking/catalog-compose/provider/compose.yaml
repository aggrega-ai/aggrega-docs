apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: compose
  version: "1.0.0"
spec:
  # baseSchema validates Recipe valuesMapping output for sourced compose
  # files (spec.source pointing at a compose fragment + valuesMapping —
  # the path the adminer Recipe and the bridge FeatureRecipe both take).
  baseSchema: |
    type: object
    properties:
      image: { type: string }
      replicas: { type: integer, default: 1 }
      ports:
        type: array
        items: { type: string }
      environment:
        type: object
        additionalProperties:
          oneOf:
            - { type: string }
            - { type: integer }
    additionalProperties: true
  # workloadSchema present = compose supports Workload synthesis (the db
  # Recipe's path).
  workloadSchema: |
    type: object
    additionalProperties: true

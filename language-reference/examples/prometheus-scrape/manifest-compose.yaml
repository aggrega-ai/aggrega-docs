apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Prometheus type is realized
    by the compose Recipe, and the web backend by the Adminer compose Recipe.
    Recipe selection at build time is by component type against the loaded
    catalog.
spec:
  mappings:
    components:
      type:
        core/observability/prometheus:1.0.0: prometheus:1.0.0
        core/devtool/adminer:1.0.0: compose/adminer:1.0.0

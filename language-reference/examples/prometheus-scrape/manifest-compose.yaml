apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Prometheus type is realized
    by the compose Recipe, and the Grafana type by the Grafana compose Recipe.
    Recipe selection at build time is by component type against the loaded
    catalog.
spec:
  mappings:
    components:
      type:
        core/observability/prometheus:1.0.0: compose/prometheus:1.0.0
        core/observability/grafana:1.0.0: compose/grafana:1.0.0

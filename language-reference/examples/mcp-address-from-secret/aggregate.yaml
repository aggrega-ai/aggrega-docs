apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mcp-address-from-secret
  version: "1.0.0"
  description: >
    An agent reaching a Model Context Protocol server someone else runs, a
    server that reads its key from its own address. The tool is declared here
    and its address is left to each Release, and so is the secret on the
    agent's connection that holds the whole address, key included. The agent is
    declared in this workspace's own catalog; the tool ships in the
    standard-library catalog.
spec:
  components:
    # ── The tool ────────────────────────────────────────────────────────────
    # A Model Context Protocol server. How it is realized — an image run in
    # the cluster, a package behind a bridge, or a server someone else runs —
    # is the Manifest's choice, and its address is the Release's.
    search:
      type: core/ai-tool/mcp

    # ── The agent ───────────────────────────────────────────────────────────
    # Wired to the tool through the tools socket its Component declares. The
    # connection's two secret slots, credential and endpoint, are left for the
    # Release to fill, because which one a server needs, and where its secret
    # lives, is decided per environment.
    agent:
      type: local/ai-agent/mcp-client
      uses:
        tools:
          search:
            target: search

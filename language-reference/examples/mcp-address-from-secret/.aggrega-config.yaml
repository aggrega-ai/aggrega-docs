workspace:
  catalog_dirs:
    # The workspace's own catalog first: it declares the agent this workspace
    # deploys and its two Recipes. Then the standard-library catalog, which
    # supplies the tool, the two credential Features and their realizations.
    - ./catalog
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer removes the sibling catalog entry above and
# resolves catalog entities from the hub registry.
default_registry: hub.aggrega.ai

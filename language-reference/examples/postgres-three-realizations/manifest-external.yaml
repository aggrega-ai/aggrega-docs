apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-external
  version: "1.0.0"
  description: >
    Ops mapping for the referenced realization. The PostgreSQL component type
    binds the Recipe that provisions nothing and emits only the wiring needed to
    reach a server that already exists — an ExternalName Service aliasing the
    address the Release supplies.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: helm/postgres-external:1.0.0
        local/compute/db-consumer:1.0.0: helm/db-consumer:1.0.0

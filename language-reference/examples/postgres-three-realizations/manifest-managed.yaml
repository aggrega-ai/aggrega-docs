apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-managed
  version: "1.0.0"
  description: >
    Ops mapping for the managed realization. The PostgreSQL component type binds
    the Recipe that emits a managed AWS RDS instance as Terraform HCL, so the
    cloud provider operates the server. The application is unchanged and still
    renders to Kubernetes: the two realizations meet at the database's published
    contract, not at a shared target.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-rds:1.0.0
        local/compute/db-consumer:1.0.0: helm/db-consumer:1.0.0
    features:
      type:
        # The managed Releases attach core/backup to the database. This
        # FeatureRecipe leaves the backup to the instance's own automated
        # backups and renders nothing: the database Recipe reads the
        # attachment and sets the instance's backup arguments itself.
        core/backup:1.0.0: terraform/backup-native:1.0.0

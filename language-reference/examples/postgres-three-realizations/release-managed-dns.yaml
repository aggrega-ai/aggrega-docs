apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: managed-dns
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-managed
  boundaries:
    stack:
      directory: stack
      components:
        # Listed with no sizing of its own: naming a component in a boundary
        # is what places it there, and this application keeps the operational
        # defaults its Component declares. Its sizing is identical in every
        # Release of this example, so nothing about the application varies.
        app: {}
        db:
          infra:
            engine_version: "16"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: true
              read_replicas: 0
            backup:
              enabled: true
              retention_days: 14
            # The DNS name the operator points at the instance once it exists.
            # The Recipe publishes it as the database's host in place of the
            # Terraform reference, so the application, which renders to
            # Kubernetes, is handed a name it can resolve. Nothing here creates
            # the record: the compiler pipes the name through without resolving
            # it, and pointing it at the instance is the operator's.
            overrides:
              host: db.internal.example.net

workspace:
  catalog_dirs:
    # The example's own catalog carries only the consuming application — its
    # Component and the one Recipe that renders it. Everything on the database
    # side comes from the standard library, unmodified.
    - ./catalog
# The hub registry supplies the PostgreSQL Component, its three Recipes, and
# the helm and terraform Providers.
default_registry: hub.aggrega.ai

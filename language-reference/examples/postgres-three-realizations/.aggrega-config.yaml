workspace:
  catalog_dirs:
    # The example's own catalog carries only the consuming application — its
    # Component and the one Recipe that renders it. Everything on the database
    # side comes from the standard library below, unmodified.
    - ./catalog
    # The sibling standard-library catalog supplies the PostgreSQL Component,
    # its three Recipes, and the helm and terraform Providers.
    - ../../../../aggrega-hub/aggrega-catalog
# Online default: a standalone consumer without the sibling catalog above
# resolves catalog entities from the hub registry.
default_registry: hub.aggrega.ai

apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: managed
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-managed
  boundaries:
    stack:
      directory: stack
      components:
        # Listed with no sizing of its own: naming a component in a boundary
        # is what places it there, and this application keeps the operational
        # defaults its Component declares. Its sizing is identical in all
        # three deployments, so nothing about the application varies.
        app: {}
        db:
          infra:
            engine_version: "16"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: true
              read_replicas: 0
            backup:
              enabled: true
              retention_days: 14

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: managed
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-managed
  boundaries:
    stack:
      directory: stack
      components:
        # Listed with no sizing of its own: naming a component in a boundary
        # is what places it there, and this application keeps the operational
        # defaults its Component declares. Its sizing is identical in all
        # three deployments, so nothing about the application varies.
        app: {}
        db:
          # RDS keeps the instance's automated backups for 7 days unless a
          # core/backup attachment says otherwise; this one keeps each for 14.
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "16"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: true
              read_replicas: 0

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: external
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-external
  boundaries:
    stack:
      directory: stack
      components:
        # Listed with no sizing of its own: naming a component in a boundary
        # is what places it there, and this application keeps the operational
        # defaults its Component declares. Its sizing is identical in all
        # three deployments, so nothing about the application varies.
        app: {}
        db:
          infra:
            # The address of the server that already exists. It is a
            # deterministic pointer string: the compiler pipes it through
            # without resolving it, and whatever answers at that name at deploy
            # time is what the application reaches.
            overrides:
              host: postgres.data.example.net

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    Two instances of one component type (app/greeter). The developer authors
    the same kind of intent for both; which physical Recipe each instance
    resolves to is an Ops concern expressed in the Manifest, not here. The
    Aggregate stays implementation-agnostic.
spec:
  components:
    greeter-default:
      type: app/greeter
      values:
        message: "hello from the default greeter"
    greeter-special:
      type: app/greeter
      values:
        message: "hello from the special greeter"

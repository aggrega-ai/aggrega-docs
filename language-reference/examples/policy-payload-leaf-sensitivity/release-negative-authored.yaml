apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: authored
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-authored.yaml
  manifest: ./manifest.yaml
  boundaries:
    infra:
      # Each release writes into its own directory. There is no flag for the
      # output location — the boundary names it — so two releases sharing one
      # directory would have the second overwrite the first.
      directory: infra-authored
      components:
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3

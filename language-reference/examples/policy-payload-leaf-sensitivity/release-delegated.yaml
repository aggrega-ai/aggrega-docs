apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: delegated
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-delegated.yaml
  manifest: ./manifest.yaml
  boundaries:
    infra:
      # Each release writes into its own directory. There is no flag for the
      # output location — the boundary names it — so two releases sharing one
      # directory would have the second overwrite the first.
      directory: infra-delegated
      components:
        db:
          features:
            # core/generated-secret is the engine-managed half of the pair. The
            # target engine owns the credential, so the operator binds the slot
            # here; the Feature declares no values and no infra, so the
            # attachment authors nothing.
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3

workspace: {}
# The hub registry supplies the Component, the two credential Features, their
# Recipes and the governance Plugin entity attached below.
default_registry: hub.aggrega.ai

# The governance socket. One attachment, in the verdict role that reads the
# build graph: it returns an accept-or-reject and never a change, so a policy
# here can stop a build and cannot rewrite one into compliance.
#
# Swap the source to policy-attachment-wide.rego to run the control described
# in the README — the same two builds, judged by the whole-attachment answer
# instead of by the payload leaf.
plugins:
  governance:
    - uri: governance/rego:0.8.6
      role: ir-verdict
      with:
        sources:
          - policy.rego

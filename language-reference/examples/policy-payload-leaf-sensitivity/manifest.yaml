apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Terraform target, shared by both releases. Both
    credential Features are bound here, so the two releases differ only in
    which one fills the slot: the authored Aggregate attaches one, the delegated
    Release the other. Recipe selection at build time is by component and
    Feature type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb:1.0.0: terraform/mariadb-rds:1.0.0
    features:
      type:
        core/secret-value:1.0.0: terraform/variable-secret:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0

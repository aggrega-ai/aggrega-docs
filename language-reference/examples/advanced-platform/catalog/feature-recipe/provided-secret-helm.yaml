apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: provided-secret-helm
  version: 1.0.0
  description: >
    Helm implementation of core/secret-provided. Exposes the value as the
    `value` provides key; the attached component's secret.inject maps it to a
    delivery target. No injectMapping — delivery is developer-dictated (the
    transparent slot), not Recipe-controlled.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: helm
  implements: core/secret-provided
  provides:
    value: "{{ .values.source }}"

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A MariaDB database with an Adminer web UI in front of it. This is the
    single Developer-authored intent surface. The same Aggregate compiles
    to Docker Compose and to Kubernetes/Helm; only the loaded Recipe layer
    differs per target.
spec:
  # ── Parameter hoisting ──────────────────────────────────────────────
  # A typed parameter the Release fulfils per environment: app_design hoists
  # into web.values.design (the Adminer theme), flowing a typed parameter into
  # a standard developer value. (The database's chart/source version is the
  # operator's infra.source_version knob, set Release-side — not hoisted into.)
  parameters:
    app_design:
      type: string
      default: pepa-linha-dark
      description: >
        Adminer UI theme. Hoisted into web.values.design — a typed parameter
        flowing into a standard developer value, fulfilled per environment.
  components:
    # ── Database ────────────────────────────────────────────────────────
    db:
      type: core/datastore/mariadb
      values:
        database: appdb
        user: appuser
        charset: utf8mb4
        collation: utf8mb4_general_ci
      # Credentials live in the secrets: pillar (each Feature is labeled
      # feature.aggrega.ai/kind: secret), never features:. The two slots the
      # Component's secretsSchema declares demonstrate both delivery models:
      #
      #   - root_password is a BLACK-BOX slot (secretsSchema inject: []): the
      #     FeatureRecipe controls delivery, injecting the value straight into
      #     the component's pipe. The developer may not dictate delivery.
      #   - user_password is a TRANSPARENT slot (secretsSchema inject:
      #     [env, file]): the credential exposes its value as a `provides` key,
      #     and the developer dictates delivery with the secret.inject block
      #     below (the third inject placement).
      #
      # Either way the value lands on .context.inject.env.<VAR>, which the
      # database Recipe reads.
      secrets:
        root_password:
          type: core/secret-value
          values:
            key: MARIADB_ROOT_PASSWORD
            origin: dev-root-pw-change-me
        user_password:
          type: core/secret-provided
          values:
            origin: dev-app-pw-change-me
          inject:
            env:
              - in: MARIADB_PASSWORD
                from: value

    # ── Web UI ──────────────────────────────────────────────────────────
    web:
      type: app/adminer
      values:
        design: "{{ .parameters.app_design }}"
      # The database connection is wired through a reusable binding Feature
      # rather than an inline component `uses:`. The feature carries the
      # `databases` uses-edge AND its delivery: db.provides.host lands on
      # Adminer's ADMINER_DEFAULT_SERVER. The edge is therefore attributed to
      # the binding feature (its origin feature) — a feature-carried
      # dependency, distinct from an inline component edge. The String Pipe is
      # unchanged: the compiler does not interpret the string; it routes
      # whatever the database Recipe's `provides.host` emits (a compose service
      # name, or a Kubernetes service DNS name) across the boundary into the
      # consumer's environment.
      features:
        db_binding:
          type: app/db-binding
          uses:
            databases:
              db:
                target: db
                inject:
                  env:
                    - in: ADMINER_DEFAULT_SERVER
                      from: host

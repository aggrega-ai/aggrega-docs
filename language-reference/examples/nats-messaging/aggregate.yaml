apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A single NATS messaging server, authored once and compiled to two targets:
    a Docker Compose service for local development and the Bitnami NATS Helm
    chart for Kubernetes. No credential is attached here, so the server runs
    without authentication on both targets. The same developer intent drives
    both; only the Recipe layer selected by the Manifest differs.
spec:
  components:
    bus:
      type: core/messaging/nats

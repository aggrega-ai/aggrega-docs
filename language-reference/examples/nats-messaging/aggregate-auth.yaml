apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-auth
  version: "1.0.0"
  description: >
    The same NATS server, this time with a password credential attached to the
    component's `password` slot, for the Compose target. When the credential
    is present the Compose Recipe starts the server with user/password
    authentication flags from the injected value; the Kubernetes target
    attaches a referenceable credential in aggregate-helm-synth-auth.yaml
    instead. Credentials are attachments on the features: pillar
    (each Feature is labeled feature.aggrega.ai/kind: secret), kept apart from
    application values.
spec:
  components:
    bus:
      type: core/messaging/nats
      features:
        password:
          type: core/secret-value
          values:
            key: NATS_PASSWORD
            origin: dev-nats-pw-change-me

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-helm-synth-auth
  version: "1.0.0"
  description: >
    The same NATS server, this time with a referenceable password credential
    attached to the component's optional `password` slot for the synthesized
    helm target. A referenced-secret credential materializes a Kubernetes Secret
    and publishes its locator; the synthesized Recipe references it as an env
    secretKeyRef and starts the server with user/password authentication flags to
    enforce authentication, so the plaintext password never lands in the rendered
    manifest. Credentials live in the secrets: pillar (each Feature is labeled
    feature.aggrega.ai/kind: secret), kept apart from application values.
spec:
  components:
    bus:
      type: core/messaging/nats
      secrets:
        password:
          type: core/referenced-secret
          values:
            key: NATS_PASSWORD
            origin: dev-nats-pw-change-me

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-compose
  version: "1.0.0"
  description: >
    Ops mapping for the Docker Compose target. The Fluent Bit forwarder is
    realized by the compose Recipe and the Fluentd aggregator by the Fluentd
    compose Recipe. Recipe selection at build time is by component type against
    the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/fluent-bit:1.0.0: fluent-bit:1.0.0
        core/observability/fluentd:1.0.0: fluentd:1.0.0

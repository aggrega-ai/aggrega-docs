apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-bitnami
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target. The Fluent Bit forwarder is sourced
    from the Bitnami Fluent Bit Helm chart and the Fluentd aggregator from the
    Bitnami Fluentd Helm chart, both rendered via the Helm SDK. Recipe selection
    at build time is by component type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/fluent-bit:1.0.0: fluent-bit-bitnami:1.0.0
        core/observability/fluentd:1.0.0: fluentd-bitnami:1.0.0

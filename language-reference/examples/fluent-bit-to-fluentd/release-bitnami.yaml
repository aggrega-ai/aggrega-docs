apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: k8s-bitnami
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest-bitnami
  boundaries:
    app:
      directory: app
      components:
        aggregator:
          # Operational sizing owned by the operator. Set explicitly so the
          # Bitnami chart values render without relying on schema defaults.
          infra:
            compute:
              cpu: 500m
              memory: 512Mi
        forwarder:
          infra:
            compute:
              cpu: 500m
              memory: 512Mi

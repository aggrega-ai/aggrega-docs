apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A two-tier log pipeline: a Fluent Bit forwarder shipping records to a
    Fluentd aggregator over the forward protocol, authored once and compiled to
    two targets — a Docker Compose stack for local development and the
    synthesized helm Recipes for Kubernetes. The forwarder declares a
    `forward_target` use of the aggregator; the aggregator's provides host and
    port are piped into the forwarder and rendered into its `forward` output, so
    the forwarder ships to the aggregator's forward endpoint. The same developer
    intent drives both targets; only the Recipe layer selected by the Manifest
    differs.
spec:
  components:
    aggregator:
      type: core/observability/fluentd
    forwarder:
      type: core/observability/fluent-bit
      uses:
        forward_target:
          aggregator:
            target: aggregator
            inject:
              env:
                - in: FLUENT_FORWARD_HOST
                  from: host
                - in: FLUENT_FORWARD_PORT
                  from: port

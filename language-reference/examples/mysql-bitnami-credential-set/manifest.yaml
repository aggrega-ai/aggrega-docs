apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: mysql-bitnami-credential-set-manifest
  version: "1.0.0"
  description: >
    Helm Ops mapping backed by the Bitnami MySQL chart. core/datastore/mysql
    binds to the mysql-bitnami Recipe (an OCI chart rendered via the Helm SDK).
    The multi-key credential (core/referenced-secret-set) binds to k8s-secret-set,
    which materializes one Kubernetes Secret carrying the caller's data keys; the
    chart Recipe references that Secret by the name the credential publishes.
spec:
  mappings:
    components:
      type:
        core/datastore/mysql: mysql-bitnami:1.0.0
    features:
      type:
        core/referenced-secret-set:1.0.0: k8s-secret-set:1.0.0

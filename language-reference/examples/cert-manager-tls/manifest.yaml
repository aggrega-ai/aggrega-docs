apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the official cert-manager
    Helm chart. cert-manager is sourced from the jetstack OCI registry and
    rendered via the Helm SDK. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/security/cert-manager:1.0.0: helm/cert-manager:1.0.0

apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: manifest-bitnami
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the Bitnami cert-manager
    Helm chart. cert-manager is sourced from an OCI chart and rendered via the
    Helm SDK. Recipe selection at build time is by component type against the
    loaded catalog.
spec:
  mappings:
    components:
      type:
        core/security/cert-manager:1.0.0: cert-manager-bitnami:1.0.0

apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A cert-manager TLS-certificate lifecycle controller for Kubernetes,
    authored once and compiled to a cert-manager Helm chart on Kubernetes.
    cert-manager is a cluster-scoped add-on that automates the issuance and
    renewal of X.509 certificates. It extends the cluster with its own
    Certificate, Issuer, and ClusterIssuer custom resources; applications
    request certificates by declaring those resources rather than through a
    wired edge, so the controller declares no upstream use. The developer keeps
    CRD installation on so the certificate API is present in the cluster.
spec:
  components:
    cert-manager:
      type: core/security/cert-manager
      values:
        install_crds: true

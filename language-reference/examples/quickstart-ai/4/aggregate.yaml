apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: quickstart-ai
  version: "1.0.0"
  description: >
    A small LangGraph agent that answers through a model and remembers each
    conversation. This is the whole developer-authored surface: which
    components there are and what each one connects to. Where they run is
    decided by the Release and the Manifest.
spec:
  components:
    # ── The agent ───────────────────────────────────────────────────────
    # A LangGraph application. Its model connection hands it the endpoint and
    # the model name, and its checkpointer connection the store it keeps every
    # conversation in, under the variable names the application reads.
    agent:
      type: core/ai-agent/langgraph
      values:
        graph_entrypoint: quickstart.graph:app
      uses:
        # The agent now reaches its model through the gateway, which publishes
        # the one model name the agent asks for.
        model:
          gateway:
            target: gateway
        checkpointer_db:
          memory:
            target: memory

    # ── The gateway ─────────────────────────────────────────────────────
    # A LiteLLM gateway in front of two models: cloud, a hosted OpenAI model,
    # and local, the Ollama model. It publishes cloud as the model the agent
    # asks for, and a request cloud cannot answer is sent on to local.
    gateway:
      type: core/gateway/litellm
      values:
        model: cloud
        # The copies of each call the gateway hands to its logs have these
        # kinds of personal data replaced, found by the two Presidio services
        # wired below. The model still receives the request as it was sent.
        log_masking:
          entities: [EMAIL_ADDRESS, PERSON, PHONE_NUMBER]
      features:
        fallbacks:
          type: core/fallback-chain
          values:
            chains:
              - alias: cloud
                fallbacks: [local]
            max_hops: 1
        # A request whose text any of these expressions matches, ignoring
        # letter case, is refused before it reaches a model.
        prompt_guard:
          type: core/prompt-deny-patterns
          values:
            deny_patterns:
              - 'ignore (all )?(the )?previous instructions'
              - 'reveal (your|the) system prompt'
      uses:
        models:
          # On Kubernetes the gateway reads the OpenAI key from a Secret that
          # already exists in its namespace: openai-api-key, under the data
          # key api-key. No file carries the key itself.
          cloud:
            target: gpt
            features:
              credential:
                type: core/referenced-secret
                values:
                  key: api-key
                  origin: openai-api-key
          local:
            target: llm
        pii_analyzer:
          analyzer:
            target: analyzer
        pii_anonymizer:
          anonymizer:
            target: anonymizer

    # ── The cloud model ─────────────────────────────────────────────────
    # OpenAI's hosted API, asked for a small model.
    gpt:
      type: core/ai-model/openai
      values:
        model: gpt-4o-mini

    # ── The local model ─────────────────────────────────────────────────
    # Ollama serving a small model that answers on an ordinary laptop's CPU.
    # The model name is pulled when the stack starts, never at build time.
    llm:
      type: core/ai-model/ollama
      values:
        model: llama3.2:1b

    # ── The memory ──────────────────────────────────────────────────────
    # A Valkey store holding each conversation, so the agent picks a
    # conversation up where it stopped, even after it restarts.
    memory:
      type: core/datastore/valkey

    # ── The personal-data recognizer ────────────────────────────────────
    # Microsoft Presidio's analyzer, which finds personal data in text, and
    # its anonymizer, which replaces what the analyzer found.
    analyzer:
      type: core/security/presidio-analyzer
    anonymizer:
      type: core/security/presidio-anonymizer

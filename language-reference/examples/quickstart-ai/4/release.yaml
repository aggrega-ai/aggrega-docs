apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: quickstart-ai-cluster
  environment: production
  version: "1.0.0"
spec:
  aggregate: quickstart-ai
  manifest: quickstart-ai-kubernetes
  components:
    agent:
      infra:
        # On Kubernetes the agent runs the image the Release names; this is the
        # same quickstart agent the Compose steps run, pinned by the digest of
        # its multi-platform index.
        image: hub.aggrega.ai/tools/quickstart-agent:1.0.1@sha256:a5f8dcfbb670d86a0cae0aadd2844bec93221a651238f8be3863873e261ee168
    gateway: {}
    gpt: {}
    llm: {}
    memory: {}
    analyzer: {}
    anonymizer: {}

apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: quickstart-ai-local
  environment: development
  version: "1.0.0"
spec:
  aggregate: quickstart-ai
  manifest: quickstart-ai-compose
  # Every component the Aggregate declares is placed by the Release. Each runs
  # with its defaults: on Docker Compose the agent runs the catalog's
  # quickstart agent image, pinned by digest, when no infra.image is set.
  components:
    agent: {}
    gateway: {}
    gpt: {}
    llm: {}
    memory: {}

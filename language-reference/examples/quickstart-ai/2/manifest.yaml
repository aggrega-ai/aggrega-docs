apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: quickstart-ai-compose
  version: "1.0.0"
  description: >
    Ops mapping for Docker Compose on one machine: each component type binds
    its Compose Recipe, and each attachment the realization that writes it
    into the gateway's configuration or the Compose file.
spec:
  mappings:
    components:
      type:
        core/ai-agent/langgraph:1.0.0: compose/langgraph:1.0.0
        core/ai-model/ollama:1.0.0: compose/ollama:1.0.0
        core/datastore/valkey:1.0.0: compose/valkey:1.0.0
        core/gateway/litellm:1.0.0: compose/litellm-gateway:1.0.0
        core/ai-model/openai:1.0.0: compose/openai:1.0.0
    features:
      type:
        core/fallback-chain:1.0.0: compose/fallback-chain:1.0.0
        core/secret-value:1.0.0: compose/dotenv-secret:1.0.0

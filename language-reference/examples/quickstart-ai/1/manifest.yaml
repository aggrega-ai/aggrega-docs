apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: quickstart-ai-compose
  version: "1.0.0"
  description: >
    Ops mapping for Docker Compose on one machine: each component type binds
    its Compose Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-agent/langgraph:1.0.0: compose/langgraph:1.0.0
        core/ai-model/ollama:1.0.0: compose/ollama:1.0.0
        core/datastore/valkey:1.0.0: compose/valkey:1.0.0

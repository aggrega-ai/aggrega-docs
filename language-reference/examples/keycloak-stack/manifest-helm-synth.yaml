apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest-helm-synth
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by synthesized manifests. The
    backend and server types are realized by their synth helm Recipes — the
    backend as a StatefulSet with a persistent volume, the server as a stateless
    Deployment that provisions and migrates its own schema on startup. The
    module attaches the core/referenced-secret credential Feature to its
    components' credential slots, the server's database password on its
    connection to the backend, so the Feature is mapped here too: bound to
    k8s-secret-from-parameter, it reads each of the module's credential
    parameters as the credential itself and emits a Secret carrying it, which
    suits an evaluation stack running on the module's development defaults.
    Recipe selection at build time is by component type against the loaded
    catalog.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: helm/postgres:1.0.0
        core/security/keycloak:1.0.0: helm/keycloak:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: helm/k8s-secret-from-parameter:1.0.0

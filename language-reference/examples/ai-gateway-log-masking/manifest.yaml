apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-gateway-log-masking-manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target. Every component type and every
    attached Feature is routed to the standard-library Recipe that implements
    it on this target.
spec:
  mappings:
    components:
      type:
        # The gateway's routing table is a configuration body, and it is
        # realized on this target alone, which is why this example is
        # Kubernetes-only.
        core/gateway/litellm:1.0.0: helm/litellm-gateway:1.0.0
        core/ai-model/openai:1.0.0: helm/openai:1.0.0
        core/security/presidio-analyzer:1.0.0: helm/presidio-analyzer:1.0.0
        core/security/presidio-anonymizer:1.0.0: helm/presidio-anonymizer:1.0.0
    features:
      type:
        # The model's key is a Secret the namespace already holds, which origin
        # names, so no file carries the key itself. The log masking needs no
        # mapping of its own: it is a value of the gateway, which the gateway's
        # Recipe above renders.
        core/referenced-secret:1.0.0: helm/k8s-existing-secret:1.0.0

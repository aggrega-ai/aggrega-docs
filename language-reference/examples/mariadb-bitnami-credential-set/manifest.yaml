apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: mariadb-bitnami-credential-set-manifest
  version: "1.0.0"
  description: >
    Helm Ops mapping backed by the Bitnami MariaDB chart. core/datastore/mariadb
    binds to the mariadb-bitnami Recipe (an OCI chart rendered via the Helm SDK).
    The multi-key credential (core/referenced-secret-set) binds to k8s-secret-set,
    which materializes one Kubernetes Secret carrying the caller's data keys; the
    chart Recipe references that Secret by the name the credential publishes.
spec:
  mappings:
    components:
      type:
        core/datastore/mariadb: helm/mariadb-bitnami:1.0.0
    features:
      type:
        core/referenced-secret-set:1.0.0: helm/k8s-secret-set:1.0.0

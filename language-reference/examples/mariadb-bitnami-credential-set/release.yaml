apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mariadb-bitnami-credential-set
  environment: production
  version: "1.0.0"
spec:
  aggregate: mariadb-bitnami-credential-set
  manifest: mariadb-bitnami-credential-set-manifest
  boundaries:
    app:
      directory: app
      components:
        # infra — the Operator-sizing pillar. Set explicitly so the Bitnami
        # chart values render without relying on schema defaults.
        db:
          infra:
            engine_version: "11.4"
            compute:
              cpu: 500m
              memory: 1Gi
            storage:
              size: 8Gi
              type: standard
            ha:
              enabled: false
              read_replicas: 0

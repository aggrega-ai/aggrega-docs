apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    A Grafana Loki log-aggregation server for Kubernetes, authored once and
    compiled to the official Grafana Loki Helm chart in its single-binary shape.
    Loki receives log streams over its HTTP push API, indexes them by label,
    stores them in a chunk object store, and answers log-query requests over the
    same HTTP API; a log shipper pushes streams to it and a dashboards server
    reads them back. The developer keeps stored logs for seven days.
spec:
  components:
    logging:
      type: core/observability/loki
      values:
        retention_period: "168h"

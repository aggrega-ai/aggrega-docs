apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Ops mapping for the Kubernetes target backed by the official Grafana Loki
    Helm chart. Loki is sourced from an OCI chart and rendered via the Helm SDK
    in its single-binary shape. Recipe selection at build time is by component
    type against the loaded catalog.
spec:
  mappings:
    components:
      type:
        core/observability/loki:1.0.0: helm/loki:1.0.0

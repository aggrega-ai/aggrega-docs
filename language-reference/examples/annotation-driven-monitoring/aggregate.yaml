apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: monitoring-demo
  version: "1.0.0"
  description: >
    Six HTTP services across a nested platform topology. Developer intent
    declares only the services — none carries a monitoring `features:` block.
    Monitoring is attached entirely by an operator annotation in the Release,
    expanded per component by the Manifest's features.annotations binding.
spec:
  components:
    gateway: { type: app/service }
    api: { type: app/service }
    worker: { type: app/service }
    ledger: { type: app/service }
    etl: { type: app/service }
    reconcile: { type: app/service }

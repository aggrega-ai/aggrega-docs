apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: scrape-target-helm
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe: emits one Prometheus ServiceMonitor per
    attached component from a local chart, templating the scrape interval, port,
    and path from the component's resolved feature infra. Resource Generation via
    source + valuesMapping; the per-component .context.* root is available at
    component scope.
spec:
  provider: helm
  implements: core/scrape-target
  # executionScope omitted -> component: renders once per attached component.
  source: ./scrape-target/chart
  valuesMapping: |
    targetName: "{{ .context.instance_id }}"
    interval: "{{ .infra.interval }}"
    port: "{{ .infra.port }}"
    path: "{{ .infra.path }}"

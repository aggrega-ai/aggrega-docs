# The collector of a Markdown documentation corpus translated with @cognitio/l10n:
# the translation workflow's companion, copied beside it to the repository as
# .github/workflows/l10n-collect.yml, and named by the configuration's
# `ci.collector`. It runs the same command, `npx l10n ci`, with the same rules.
#
# 🔴 It runs only when started by hand — from the repository's Actions page, or
# `gh workflow run l10n-collect.yml` — and carries no schedule, because a run
# that collects also submits whatever still lacks a translation, and is paid
# for. `l10n ci` still switches this workflow on while a batch is recorded and
# off when none is (`ci.collector`); with no schedule that starts nothing.
#
# It shares the translation workflow's concurrency group, so the two never
# race for the CI branch, and it assumes what that workflow's comment lists.
#
# It never runs for a pull request: it holds the translation API key.
name: Collect translations

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: l10n
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A manual run can start from any branch; the content translated is the
      # working branch's, so the checkout names it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The package is installed here alone, from the vendored archive whose path
      # `sh l10n/install.sh --cwd l10n path` reads from l10n/cognitio-modules.json,
      # its dependencies from the public registry, and saved nowhere: the
      # repository root has no package.json, so the documentation site builds
      # from a plain clone without it.
      - name: Install
        run: npm install --no-save --no-audit --no-fund "$(sh l10n/install.sh --cwd l10n path @cognitio/l10n)"

      - name: Collect, submit and push the translation memory
        run: npx l10n ci --config l10n/l10n.config.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

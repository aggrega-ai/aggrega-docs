name: Publish and sign documentation

# Tag-driven publisher for the documentation bundle. On a documentation release
# tag it packs the reader-facing docs into a deterministic gzipped tar and
# publishes that bundle as a standalone OCI data artifact at docs/aggrega-docs,
# then signs the published reference keyless via the GitHub Actions OIDC identity
# against public Sigstore (Fulcio + Rekor).
#
# The documentation bundle is NOT a catalog entity: it carries no entity
# envelope and no kind, so it rides the generic data-artifact transport
# (`aggrega push-artifact`) rather than the kind-dispatched `aggrega push`. The
# bytes are opaque to the transport; determinism comes entirely from the bundle
# build script, and the transport pins its manifest's creation annotation so
# byte-identical bytes yield a byte-identical digest.
#
# This workflow NEVER creates or pushes a git tag and never writes git at all.
# Deciding the version and cutting the tag is a human action; this workflow only
# publishes and signs OCI artifacts.
#
# NOT YET LIVE. The destination registry, its pull/push credentials, and the
# tooling-image tag are all operator-configured and are not wired here. Until they exist this workflow is authored but unexercised — it has
# never run against a real registry. The manual-dispatch entry defaults to a dry
# run, so an unconfigured or accidental invocation prints what it would do
# without building a real publish, signing, or contacting any registry.

on:
  # A documentation release tag is the trigger and the human gate: a person
  # decides the version and pushes the tag. The pattern matches a plain
  # vMAJOR.MINOR.PATCH tag; a pre-release suffix is intentionally excluded from
  # automatic publishing.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack the bundle and print the proposed reference and sign command without publishing, signing, or contacting the registry."
        required: false
        default: true
        type: boolean
      tag:
        description: "The release tag (vMAJOR.MINOR.PATCH) to build and publish on a manual run; required for a real manual publish, ignored on a tag push (which uses the pushed tag)."
        required: false
        default: ""
        type: string

# Keyless signing via the GitHub Actions OIDC identity. The workflow mints a
# short-lived identity token from the Actions runtime and signs against public
# Sigstore (Fulcio + Rekor); no offline key is stored. The docs bundle publishes
# to the public hub, so recording the reference in the public transparency log is
# expected, not a leak. id-token:write lets the job mint the OIDC token; the
# workflow reads only from the repository it checks out and writes nothing back
# to git, so contents:read is all the git access it needs.
permissions:
  contents: read
  id-token: write

jobs:
  publish-sign:
    # Configurable runner label. Packing a docs bundle is light; the default
    # hosted runner is fine. Point the DOCS_PUBLISH_RUNNER repository variable at
    # a self-hosted label to move the work off metered hosted minutes.
    runs-on: ${{ vars.DOCS_PUBLISH_RUNNER || 'ubuntu-latest' }}

    # Run inside the published tooling image so `aggrega` is already on PATH — no
    # toolchain build here. The image must also provide git (for checkout), bash,
    # tar and gzip, which the bundle build script uses to pack the docs, plus
    # curl, which the OIDC-token step uses to mint the keyless signing identity
    # from the Actions runtime.
    #
    # PIN SEAM — the tooling-image tag comes from the TOOLING_IMAGE_TAG
    # repository variable, which the operator sets once (for example, to
    # `stable`, the moving tag the publisher points at the most recently
    # published image). The job derives its execution image from exactly this
    # line; the registry-and-name prefix is fixed and only the tag is
    # operator-set. An unset variable yields an empty tag, which cannot resolve
    # a real image.
    #
    # Tracking the moving `stable` tag means a newly published tooling image is
    # adopted on the next run without editing this file. To pin a fixed version
    # instead, set the variable to that version tag.
    #
    # The registry is authenticated even on pull, so the image is pulled with the
    # same registry credentials used to push.
    container:
      image: hub.aggrega.ai/tools/aggrega:${{ vars.TOOLING_IMAGE_TAG }}
      credentials:
        username: ${{ vars.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    env:
      # Destination registry host:port. A repository variable the operator sets
      # once; the placeholder default cannot publish anywhere real.
      REGISTRY: ${{ vars.DOCS_PUBLISH_REGISTRY || 'registry.invalid:0' }}
      # Registry credentials — needed on EVERY job because the registry is
      # authenticated on push AND pull. Read via the environment (not
      # interpolated into a run script) to avoid expression injection. The
      # username feeds `aggrega login`; the password is read by login from
      # AGGREGA_REGISTRY_PASSWORD.
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      AGGREGA_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # Public-good Sigstore endpoints for keyless signing. The binary already
      # defaults to these; they are named here so the `aggrega sign` call states
      # the trust roots explicitly.
      FULCIO_URL: https://fulcio.sigstore.dev
      REKOR_URL: https://rekor.sigstore.dev
      # Dispatch inputs surfaced as env so run scripts read them from the
      # environment rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
      # The release tag requested by a manual dispatch (empty on a tag push).
      # Surfaced as env so the effective tag is read from the environment, never
      # interpolated into a script.
      DISPATCH_TAG: ${{ inputs.tag }}
      # The pushed ref name (the tag on a push event). Surfaced as env so the
      # version is read from the environment, never interpolated into a script.
      REF_NAME: ${{ github.ref_name }}
      # Reserved artifact name within the docs/ namespace. The bundle publishes
      # at docs/<DOCS_ARTIFACT_NAME>.
      DOCS_ARTIFACT_NAME: aggrega-docs

    steps:
      - name: Check out the documentation
        # Full history and tags are fetched so a run that targets a past release
        # tag can check that tag's source out before packing the bundle.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin the documentation source to the release tag
        # Move the docs tree onto the release tag before packing so the bundle
        # carries that tag's documentation, not whatever ref the workflow was
        # launched from. On a tag push the effective tag is the pushed tag (a
        # no-op re-affirm of the already-checked-out ref); on a manual dispatch
        # that supplies a tag input the effective tag is that input. A manual dry
        # run with no tag input skips this and packs the launched ref.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          git fetch --force --tags origin
          git checkout --force "refs/tags/${TAG}"

      - name: Authenticate to the registry
        # Only a real publish contacts the registry. A dry run does no network,
        # so it skips login and stays runnable without live credentials.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          # login reads the password from AGGREGA_REGISTRY_PASSWORD; the username
          # comes from the environment. No secret is placed on the command line
          # or interpolated from an expression.
          aggrega login "$REGISTRY" --username "$REGISTRY_USERNAME"

      - name: Mint the Sigstore OIDC identity token
        # Keyless signing needs a short-lived OIDC identity token. Request one
        # from the Actions runtime (available because id-token:write is granted),
        # audience-scoped to sigstore, and export it as SIGSTORE_ID_TOKEN so the
        # `aggrega sign` call reads it non-interactively — no browser, no offline
        # key. Only a real publish signs, so a dry run skips this.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          token_json="$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          id_token="$(printf '%s' "$token_json" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$id_token" ] || { echo "OIDC: runtime returned no token value" >&2; exit 1; }
          echo "::add-mask::$id_token"
          echo "SIGSTORE_ID_TOKEN=$id_token" >> "$GITHUB_ENV"

      - name: Build, publish and sign the documentation bundle
        run: |
          set -euo pipefail

          # A push event is always a real publish at the tag's version; a manual
          # dispatch honors its dry-run input and supplies its own tag. All
          # inputs are read from the environment, never interpolated into shell.
          # The effective tag is the pushed tag (push) or the tag input
          # (dispatch); the bundle publishes under the v-less version to match the
          # tooling-image and catalog-entity version convention.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"

          if [ -z "$VERSION" ]; then
            if [ "$DRY" = "true" ]; then
              # A manual dry run with no tag still previews the reference shape;
              # use an obvious placeholder that never reaches a registry.
              VERSION="0.0.0-dryrun"
            else
              echo "publish-docs: a real manual publish needs a tag (set the 'tag' dispatch input)" >&2
              exit 2
            fi
          fi

          # Pack the deterministic bundle. The script pins every source of
          # tar/gzip non-determinism, so the same tree always yields the same
          # bytes — and therefore the same manifest digest through the transport.
          BUNDLE="dist/aggrega-docs.tar.gz"
          scripts/build-docs-bundle.sh --output "$BUNDLE"

          if [ "$DRY" = "true" ]; then
            # Dry run: print the proposed reference (and the sign command that
            # would follow) without any network call, publish, or signing.
            aggrega push-artifact "$BUNDLE" \
              --name "$DOCS_ARTIFACT_NAME" \
              --tag "$VERSION" \
              --registry "$REGISTRY" \
              --dry-run
            echo "publish-docs (dry-run): would sign $REGISTRY/docs/$DOCS_ARTIFACT_NAME:$VERSION keyless against public Sigstore"
            exit 0
          fi

          # Real publish: push the opaque bundle bytes at docs/<name>:<version>.
          aggrega push-artifact "$BUNDLE" \
            --name "$DOCS_ARTIFACT_NAME" \
            --tag "$VERSION" \
            --registry "$REGISTRY"

          # Sign the published artifact by reference, keyless against public
          # Sigstore. Signing is kind-agnostic — it needs only the reference this
          # publish landed. The reference is composed deterministically from the
          # same inputs the publish used (registry + reserved docs/ namespace +
          # name + version). The identity token is read from SIGSTORE_ID_TOKEN
          # (minted above).
          aggrega sign "$REGISTRY/docs/$DOCS_ARTIFACT_NAME:$VERSION" \
            --fulcio-url "$FULCIO_URL" --rekor-url "$REKOR_URL"

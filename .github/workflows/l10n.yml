# The translation workflow of a Markdown documentation corpus translated with
# @cognitio/l10n. Copy it to the corpus repository as
# .github/workflows/l10n.yml. It runs the package's CI command, `l10n ci`,
# which collects the translation batches that have ended, submits the source
# segments that still lack a translation, and pushes the translation-memory
# branch the configuration names (`ci.branch`) — the only branch it writes —
# then, when a collection applied translations and the configuration names
# `ci.dispatch`, dispatches that workflow. The configuration beside this
# template names none.
#
# 🔴 It runs only when started by hand — from the repository's Actions page, or
# `gh workflow run l10n.yml` — and never on a push or a schedule, because every
# run submits the segments still lacking a translation and is paid for. The
# translation is started deliberately, here or locally with the package's own
# command, never as a side effect of pushing documentation. A batch it submits
# is collected by the next manual run of this workflow or of its collector,
# l10n-collect.yml.
#
# It assumes:
#   - the working branch `main`;
#   - the configuration at l10n/l10n.config.json, with the memory under
#     l10n/memory/ (`memory.dir: "memory"`) and the prompt files under
#     l10n/prompts/ (`promptsDir: "prompts"`);
#   - the corpus's source files at the repository root (`adapter.sourceDir:
#     ".."`), selected by the configuration's `adapter.include` globs, and never
#     the output under l10n/<locale>/ (`adapter.outDir: "."`);
#   - the API key in the repository secret ANTHROPIC_API_KEY, the variable
#     `backend.apiKeyEnv` names; a workflow receives only the secrets it names;
#   - the package vendored as its published archive under l10n/vendor/, the one
#     l10n/cognitio-modules.json names, installed with `npm ci` from
#     l10n/package.json and l10n/package-lock.json, and no package.json at the
#     repository root; the install reads no secret. Moving to a new version is
#     the cognitio-modules command's `upgrade` —
#     `sh l10n/install.sh --cwd l10n upgrade` at this repository's root, or,
#     from a repository holding this one as a submodule, the same command with
#     the script's path and `--cwd` naming the submodule's l10n/ directory —
#     followed by updating l10n/package.json's archive path and the lockfile, and
#     no change here.
#
# It never runs for a pull request: it holds the translation API key.
name: Translate

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: l10n
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A manual run can start from any branch; the content translated is the
      # working branch's, so the checkout names it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The package is installed here alone, into l10n/node_modules, from the vendored
      # archive that l10n/package.json names, with every dependency at the version
      # and integrity l10n/package-lock.json records and no install script run: the
      # repository root has no package.json, so the documentation site builds from a
      # plain clone without it.
      - name: Install
        working-directory: l10n
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Collect, submit and push the translation memory
        run: l10n/node_modules/.bin/l10n ci --config l10n/l10n.config.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

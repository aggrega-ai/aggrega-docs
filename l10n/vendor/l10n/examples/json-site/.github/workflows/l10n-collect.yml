# The collector of a block-composed site translated with @aggrega-ai/l10n:
# the translation workflow's companion, copied beside it to the repository as
# .github/workflows/l10n-collect.yml, and named by the configuration's
# `ci.collector`. It runs the same command, `npx l10n ci`, with the same rules,
# every 10 minutes — its one automatic trigger — and by hand.
#
# `l10n ci` switches it on when a run leaves a batch recorded on the CI branch,
# and off when a run leaves none, so it runs only while a batch is pending, and
# an idle project runs nothing. A workflow file has no disabled state of its
# own: pushed, it is enabled, and its first scheduled run switches it off
# unless that run leaves a batch recorded. Disable it at once from the repository's Actions
# page, or with `gh workflow disable l10n-collect.yml`, to skip even that run.
# GitHub runs a schedule only from the default branch, so it collects once both
# workflows sit there; until then the next push or a manual run collects.
#
# It shares the translation workflow's concurrency group, so the two never
# race for the CI branch, and it assumes what that workflow's comment lists.
#
# It never runs for a pull request: it holds the translation API key.
name: Collect translations

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: l10n
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A scheduled run starts from the default branch; the content translated is
      # the working branch's, so the checkout names it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # The package comes from its vendored directory, its dependencies from the
      # public registry, as package-lock.json records them.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Collect, submit and push the translation memory
        run: npx l10n ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

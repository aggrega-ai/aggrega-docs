# The check workflow of a block-composed site translated with @aggrega-ai/l10n
# in the local mode. Copy it to the site's repository as
# .github/workflows/l10n-check.yml. It runs the push check the pre-push hook
# runs, `l10n prepush`, on the pushed commit, so a push the hook never saw —
# one made with `git push --no-verify`, or from another machine with no hook —
# turns red with the same message. It translates nothing and holds no API key.
#
# It runs on every push, to any branch, touching the English content, the UI
# dictionary, the memory (both layers and the prompt files) or the generated
# targets, and by hand.
#
# It assumes:
#   - the configuration of this example, l10n.local.json at the repository
#     root, which the check step names with --config; a project whose
#     configuration is l10n.config.json at the root drops the --config;
#   - the package vendored at vendor/l10n/, which package.json depends on as
#     `file:vendor/l10n`, so the install reads no secret. A project with a
#     private dependency passes its credential in the install step, and in no
#     other.
#
# It never runs for pull_request_target, and its token can only read.
name: Translation check

on:
  push:
    paths:
      - content/en/**
      - ui/en.json
      - i18n/**
      - content/it/**
      - content/de/**
      - ui/it.json
      - ui/de.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pushed commit, as the push or the manual run names it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # The one step that may read a secret, though the vendored package needs
      # none.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check that the pushed commit is fully translated
        run: npx --no l10n prepush --config l10n.local.json "$GITHUB_SHA"
